<title>ZSMARTFORMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: SAP GUI frame (menu bar · system toolbar · title · application toolbar · work area · status bar),
   work area split into navigation tree | node screen | Form Painter. Cool slate neutrals, SAP blue accent. */
:root {
  --bg: #e9edf1; --paper: #ffffff; --paper-2: #f5f7f9; --fg: #1c2a35; --muted: #5d6c79; --line: #b9c4ce; --line-soft: #dce2e8;
  --accent: #0a6ed1; --accent-ink: #ffffff; --accent-soft: #e3effb; --sel: #cfe3f8; --shell: #2f4459; --shell-fg: #f2f5f8; --shell-2: #3d566d;
  --ok: #1f7a3a; --err: #b00020; --warn: #b85c00; --info: #0a6ed1; --field: #ffffff; --field-ro: #eef2f5; --focus: #0a6ed1;
  --tag: #8a3ffc; --fld: #0a6ed1; --kw: #0a3fa8; --str: #1d7a1d; --cmt: #6b7d8c; --num: #a6460e;
  --ic-paper: #ffffff; --ic-line: #3b4a57; --ic-blue: #3a8de0; --ic-blue-l: #bcd9f6; --ic-green: #3fa34d; --ic-green-l: #c7ecc9; --ic-orange: #f0932b;
  --ic-yellow: #f6c445; --ic-purple: #8b5cf6; --ic-led-green: #2ea44f; --ic-led-red: #d73a49;
  --f-ui: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif; --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --fs: 12.5px; --cw: 7.4px; --lh: 24px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161d24; --paper: #1f2832; --paper-2: #252f3a; --fg: #e2e8ee; --muted: #95a4b2; --line: #3d4b59; --line-soft: #2c3743;
    --accent: #4aa8ff; --accent-ink: #0b1620; --accent-soft: #1b3550; --sel: #23425f; --shell: #0f151b; --shell-fg: #e2e8ee; --shell-2: #1b252f;
    --ok: #4cc06a; --err: #ff6b7a; --warn: #f2a14a; --info: #4aa8ff; --field: #18212a; --field-ro: #222c36; --focus: #4aa8ff;
    --tag: #b794ff; --fld: #6cb8ff; --kw: #8fb8ff; --str: #7fd18b; --cmt: #8494a3; --num: #f0a36b;
    --ic-paper: #2a3541; --ic-line: #c9d4de; --ic-blue: #5aa9f0; --ic-blue-l: #26496c; --ic-green: #55c06a; --ic-green-l: #23472b; --ic-orange: #f2a14a;
    --ic-yellow: #e8c15a; --ic-purple: #a78bfa; --ic-led-green: #4cc06a; --ic-led-red: #ff6b7a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161d24; --paper: #1f2832; --paper-2: #252f3a; --fg: #e2e8ee; --muted: #95a4b2; --line: #3d4b59; --line-soft: #2c3743;
  --accent: #4aa8ff; --accent-ink: #0b1620; --accent-soft: #1b3550; --sel: #23425f; --shell: #0f151b; --shell-fg: #e2e8ee; --shell-2: #1b252f;
  --ok: #4cc06a; --err: #ff6b7a; --warn: #f2a14a; --info: #4aa8ff; --field: #18212a; --field-ro: #222c36; --focus: #4aa8ff;
  --tag: #b794ff; --fld: #6cb8ff; --kw: #8fb8ff; --str: #7fd18b; --cmt: #8494a3; --num: #f0a36b;
  --ic-paper: #2a3541; --ic-line: #c9d4de; --ic-blue: #5aa9f0; --ic-blue-l: #26496c; --ic-green: #55c06a; --ic-green-l: #23472b; --ic-orange: #f2a14a;
  --ic-yellow: #e8c15a; --ic-purple: #a78bfa; --ic-led-green: #4cc06a; --ic-led-red: #ff6b7a; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: var(--fs)/1.35 var(--f-ui); overflow: hidden; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
code, pre, .mono { font-family: var(--f-mono); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.ic { width: 16px; height: 16px; flex: none; vertical-align: -3px; }
.muted { color: var(--muted); font-weight: 400; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- GUI frame ---------- */
#app { height: 100%; display: grid; grid-template-rows: auto auto auto auto 1fr auto; }
.menubar { display: flex; align-items: center; gap: 2px; background: var(--shell); color: var(--shell-fg); padding: 2px 8px; min-height: 30px; overflow-x: auto; scrollbar-width: none; }
.menubar .brand { font-weight: 600; letter-spacing: .06em; font-size: 11px; text-transform: uppercase; padding: 0 12px 0 2px; opacity: .85; white-space: nowrap; }
.mb-item { background: none; border: 0; color: inherit; padding: 4px 10px; border-radius: 3px; cursor: pointer; white-space: nowrap; }
.mb-item:hover, .mb-item:focus-visible { background: var(--shell-2); }
.systb { display: flex; align-items: center; gap: 4px; padding: 4px 8px; background: var(--paper-2); border-bottom: 1px solid var(--line-soft); overflow-x: auto; }
.okcode { display: flex; align-items: center; gap: 2px; }
.okcode input { width: 150px; height: 22px; border: 1px solid var(--line); background: var(--field); padding: 0 6px; border-radius: 2px; font-family: var(--f-mono); text-transform: uppercase; }
.titlebar { padding: 6px 12px 4px; background: var(--paper-2); }
.titlebar h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .01em; text-wrap: balance; }
.apptb { display: flex; align-items: center; gap: 2px; padding: 2px 8px 6px; background: var(--paper-2); border-bottom: 1px solid var(--line); flex-wrap: wrap; min-height: 32px; }
.tb-btn { display: inline-flex; align-items: center; gap: 5px; background: transparent; border: 1px solid transparent; border-radius: 3px; padding: 3px 5px; cursor: pointer; color: var(--fg); min-height: 24px; }
.tb-btn:hover:not(:disabled) { background: var(--accent-soft); border-color: var(--line-soft); }
.tb-btn:disabled { opacity: .4; cursor: default; }
.tb-btn.on { background: var(--accent-soft); border-color: var(--accent); }
.tb-btn.small { padding: 1px 3px; min-height: 20px; }
.tb-btn.lbl span, .tb-lbl { font-size: 12px; }
.tb-sep { width: 1px; height: 18px; background: var(--line); margin: 0 6px; flex: none; }
#main { min-height: 0; overflow: hidden; display: flex; }
.statusbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 3px 10px calc(3px + env(safe-area-inset-bottom, 0px)); background: var(--paper-2); border-top: 1px solid var(--line); min-height: 26px; }
.msg { display: flex; align-items: center; gap: 6px; min-width: 0; }
.msg span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.msg-E { color: var(--err); font-weight: 500; } .msg-W { color: var(--warn); } .msg-S { color: var(--ok); } .msg-I { color: var(--info); }
#sysinfo { color: var(--muted); font-size: 11.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pane { background: var(--paper); overflow: auto; min-width: 0; min-height: 0; }
.pane-title { display: flex; align-items: center; gap: 6px; font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line-soft); position: sticky; top: 0; background: var(--paper); z-index: 2; }
.pane-title .tb-btn { margin-left: auto; }
.empty { color: var(--muted); padding: 16px; }

/* ---------- builder layout ---------- */
.fb, .sb { display: flex; flex: 1; min-width: 0; min-height: 0; }
.fb-left { flex: 0 0 300px; display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
.fb-tree { flex: 1 1 60%; }
.fb-fl { flex: 1 1 40%; border-top: 1px solid var(--line); }
.fb.no-fl .fb-fl { display: none; }
.fb-center, .sb-center { flex: 1 1 auto; padding: 8px 10px 24px; }
.fb-right { flex: 0 0 400px; background: var(--paper-2); display: flex; flex-direction: column; }
.fb.no-fp .fb-right, .fb.no-fp .fb-split[data-for=right] { display: none; }
.fb.tm .fb-left, .fb.tm .fb-split { display: none; }
.sb-tree { flex: 0 0 300px; border-right: 1px solid var(--line); }
.fb-split { flex: 0 0 5px; cursor: col-resize; background: var(--line-soft); }
.fb-split:hover { background: var(--accent-soft); }
@media (max-width: 900px) {
  .fb, .sb { flex-direction: column; overflow: auto; }
  .fb-left, .sb-tree { flex: none; height: 38vh; border-right: 0; border-bottom: 1px solid var(--line); }
  .fb-right { flex: none; height: 60vh; }
  .fb-split { display: none; }
  .fb-center, .sb-center { flex: none; overflow: visible; }
  .okcode input { width: 100px; }
}

/* ---------- tree ---------- */
.tree, .tree ul { list-style: none; margin: 0; padding: 0; }
.tree { padding: 4px 0 12px; outline: none; }
.tree-row { content-visibility: auto; contain-intrinsic-size: auto 22px; display: flex; align-items: center; gap: 4px; padding: 1px 8px 1px 4px; white-space: nowrap; cursor: default; min-height: 22px; border: 1px solid transparent; }
.tree-row:hover { background: var(--paper-2); }
.tree-row.sel { background: var(--sel); }
.tree:focus .tree-row.sel { border-color: var(--accent); }
.tree-row.drop { outline: 2px dashed var(--accent); outline-offset: -2px; }
.tree-row.ref .tree-lab { font-style: italic; }
.tree-lab b { font-weight: 600; }
.twisty { width: 14px; height: 14px; flex: none; display: inline-grid; place-items: center; cursor: pointer; color: var(--muted); }
.twisty.closed::before { content: "▸"; } .twisty.open::before { content: "▾"; }
.cond-mark .ic { width: 12px; height: 12px; }
.fl-item { cursor: grab; }

/* ---------- node screen ---------- */
.node-hdr { margin-bottom: 4px; }
.tabstrip { display: flex; flex-wrap: wrap; gap: 0; border-bottom: 1px solid var(--line); margin-top: 6px; }
.tab { border: 1px solid var(--line); border-bottom: 0; background: var(--paper-2); padding: 4px 12px; margin-right: -1px; cursor: pointer; border-radius: 4px 4px 0 0; display: inline-flex; gap: 4px; align-items: center; color: var(--muted); }
.tab.on { background: var(--paper); color: var(--fg); font-weight: 600; position: relative; top: 1px; }
.tabpage { border: 1px solid var(--line); border-top: 0; padding: 10px 8px 12px; background: var(--paper); overflow: auto; }

/* ---------- dynpro ---------- */
.dyn { position: relative; }
.dyn > * { position: absolute; }
.dyn-text { height: var(--lh); line-height: var(--lh); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg); display: flex; align-items: center; gap: 4px; }
.dyn-text span { overflow: hidden; text-overflow: ellipsis; }
.dyn-field, .dyn-wrap input, .tc-in { height: 21px; margin-top: 1px; border: 1px solid var(--line); background: var(--field); border-radius: 2px; padding: 0 3px; font-size: 12.5px; min-width: 0; }
.dyn-wrap { display: flex; }
.dyn-wrap input { width: 100%; }
select.dyn-field, select.tc-in { padding: 0 2px; }
.dyn-field.upper, .tc-in.upper, input.upper { text-transform: uppercase; }
.dyn-field.ro, .tc-in.ro, .dyn-wrap input.ro, .dyn-field:disabled { background: var(--field-ro); color: var(--fg); border-color: var(--line-soft); }
.dyn-field.req:not(.ro) { border-left: 3px solid var(--warn); }
.dyn-field.has-f4 { background-image: linear-gradient(135deg, transparent 70%, var(--accent) 70%); background-repeat: no-repeat; background-size: 8px 8px; background-position: right 2px bottom 2px; }
.dyn-field.unbound { opacity: .55; }
.dyn-check, .dyn-radio { display: flex; align-items: center; gap: 5px; height: var(--lh); white-space: nowrap; }
.dyn-check.unbound, .dyn-radio.unbound { opacity: .55; }
.dyn-check.static { position: static; }
.dyn-push { height: 22px; margin-top: 1px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 0 8px; border: 1px solid var(--line); border-radius: 3px; background: var(--paper-2); cursor: pointer; white-space: nowrap; }
.dyn-push.icon-only { padding: 0; }
.dyn-push:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.dyn-push:disabled { opacity: .45; cursor: default; }
.dyn-frame { border: 1px solid var(--line); border-radius: 3px; margin: 0; padding: 0; pointer-events: none; }
.dyn-frame legend { font-weight: 600; padding: 0 4px; margin-left: 6px; font-size: 12px; }
.dyn-sub, .dyn-cust { overflow: visible; }
.dyn-cust.rv, .dyn-tc.rv { overflow: auto; }
.color-pick { display: inline-flex; align-items: center; gap: 6px; height: 22px; }
.color-pick input { width: 30px; height: 20px; padding: 0; border: 1px solid var(--line); background: none; }
.color-pick .hex { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }

/* table control */
.dyn-tc { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 2px; background: var(--paper); }
.tc-title { font-weight: 600; padding: 3px 6px; background: var(--paper-2); border-bottom: 1px solid var(--line-soft); }
.tc-scroll { overflow: auto; flex: 1; min-height: 0; }
table.tc { border-collapse: collapse; font-size: 12.5px; }
table.tc th { position: sticky; top: 0; background: var(--paper-2); font-weight: 500; text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line-soft); white-space: nowrap; z-index: 1; }
table.tc td { padding: 1px 3px; border-right: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); }
table.tc tr.sel td { background: var(--sel); }
table.tc tr.tc-empty td { background: var(--paper-2); }
table.tc tr.tc-empty .tc-in { background: transparent; border-style: dashed; }
table.tc tr.std td { color: var(--muted); }
table.tc tr.or-row td { background: var(--accent-soft); }
.tc-sel, .tc-sel-h { width: 14px; background: var(--paper-2); cursor: pointer; }
tr.sel .tc-sel { background: var(--accent); }
.tc-center { text-align: center; }
.tc-in { margin: 0; }
.tc-push { min-width: 32px; height: 20px; border: 1px solid var(--line); background: var(--paper-2); border-radius: 2px; cursor: pointer; font-family: var(--f-mono); }

/* border painter */
.border-painter { display: flex; flex-direction: column; gap: 6px; }
.bp-tools { display: flex; gap: 2px; }
.bp-preview { position: relative; width: 150px; height: 90px; background: var(--paper); border: 1px dashed var(--line); }
.bp-side { position: absolute; background: transparent; cursor: pointer; --w: 2px; }
.bp-side:hover { background: var(--accent-soft); }
.bp-left { left: 0; top: 0; bottom: 0; width: 10px; } .bp-right { right: 0; top: 0; bottom: 0; width: 10px; }
.bp-top { top: 0; left: 0; right: 0; height: 10px; } .bp-bottom { bottom: 0; left: 0; right: 0; height: 10px; }
.bp-side.on.bp-left { width: var(--w); } .bp-side.on.bp-right { width: var(--w); } .bp-side.on.bp-top { height: var(--w); } .bp-side.on.bp-bottom { height: var(--w); }
.bp-sample { position: absolute; inset: 30px 0 0; text-align: center; color: var(--muted); pointer-events: none; }
.pattern-num { display: flex; align-items: center; gap: 6px; height: 100%; }

/* ---------- ABAP editor ---------- */
.abap-host { display: flex; }
.abap-ed { display: flex; flex-direction: column; border: 1px solid var(--line); width: 100%; height: 100%; min-height: 260px; background: var(--field); }
.ab-bar { display: flex; align-items: center; gap: 1px; padding: 2px 4px; background: var(--paper-2); border-bottom: 1px solid var(--line-soft); flex-wrap: wrap; }
.ab-pos { margin-left: auto; color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.ab-body { display: flex; flex: 1; min-height: 0; font: 12.5px/16px var(--f-mono); }
.ab-gutter { flex: none; width: 44px; overflow: hidden; text-align: right; padding: 4px 6px 4px 0; color: var(--muted); background: var(--paper-2); border-right: 1px solid var(--line-soft); user-select: none; font-variant-numeric: tabular-nums; }
.ab-wrap { position: relative; flex: 1; min-width: 0; }
.ab-hl, .ab-ta { position: absolute; inset: 0; margin: 0; padding: 4px 8px; font: inherit; white-space: pre; overflow: auto; tab-size: 2; }
.ab-hl { pointer-events: none; color: var(--fg); overflow: hidden; }
.ab-ta { background: transparent; color: transparent; caret-color: var(--fg); border: 0; resize: none; outline: none; }
.ab-ta::selection { background: var(--sel); color: transparent; }
.ab-k { color: var(--kw); font-weight: 600; } .ab-s { color: var(--str); } .ab-c { color: var(--cmt); font-style: italic; } .ab-n { color: var(--num); }

/* ---------- SAPscript text editor ---------- */
.te-host { display: flex; }
.te { display: grid; grid-template-rows: auto minmax(120px, 1fr) auto; width: 100%; height: 100%; min-height: 300px; border: 1px solid var(--line); background: var(--field); }
.te-bar { display: flex; align-items: center; gap: 3px; padding: 3px 4px; background: var(--paper-2); border-bottom: 1px solid var(--line-soft); flex-wrap: wrap; }
.te-sel { height: 22px; border: 1px solid var(--line); background: var(--field); border-radius: 2px; max-width: 200px; }
.te-info { margin-left: auto; color: var(--muted); font-size: 11.5px; }
.te-body { overflow: auto; padding: 4px 0; }
.te-row { display: flex; align-items: flex-start; border-bottom: 1px solid transparent; }
.te-row.focus { background: var(--accent-soft); }
.te-fmt { flex: none; width: 32px; text-align: center; font: 11.5px/20px var(--f-mono); color: var(--accent); cursor: pointer; border-right: 1px solid var(--line-soft); user-select: none; }
.te-cell { position: relative; flex: 1; min-width: 0; font: 12.5px/20px var(--f-mono); }
.te-hl, .te-ta { margin: 0; padding: 0 6px; font: inherit; white-space: pre-wrap; word-break: break-all; }
.te-hl { position: absolute; inset: 0; pointer-events: none; color: var(--fg); }
.te-ta { position: relative; width: 100%; display: block; border: 0; background: transparent; color: transparent; caret-color: var(--fg); resize: none; outline: none; overflow: hidden; min-height: 20px; }
.te-ta::selection { background: var(--sel); }
.te-row.te-comment .te-hl { color: var(--cmt); font-style: italic; }
.te-row.te-cmd .te-hl { color: var(--num); }
.te-fld { color: var(--fld); font-weight: 600; } .te-tag { color: var(--tag); font-weight: 600; } .te-tab { color: var(--warn); }
.te-grid { font: 12.5px/20px var(--f-mono); }
.te-ruler { color: var(--muted); padding-left: 38px; white-space: pre; font-size: 11px; }
.te-lrow { display: flex; }
.te-lf { width: 32px; border: 0; border-right: 1px solid var(--line-soft); background: var(--paper-2); text-align: center; color: var(--accent); font: inherit; }
.te-ln { flex: 1; border: 0; border-bottom: 1px solid var(--line-soft); background: transparent; font: inherit; padding: 0 6px; min-width: 132ch; }
.te-pvwrap { border-top: 1px solid var(--line); background: var(--paper); max-height: 180px; overflow: auto; }
.te.te-nopv .te-pvwrap { display: none; }
.te-preview { padding: 8px 12px; background: #fff; color: #111; }
.te-pv-par { min-height: 1em; }
.te-pv-fld { color: #0a5bb5; background: #e9f2fc; border-radius: 2px; padding: 0 1px; }
.te-pv-unknown { outline: 1px dotted #b00020; }
.te-pv-cmd, .te-pv-comment { font: 11.5px var(--f-mono); color: #8a5a00; }
.te-pv-comment { color: #6b7d8c; }
.te-full { height: 70vh; display: flex; }

/* ---------- Form Painter ---------- */
.fp-bar { display: flex; align-items: center; gap: 4px; padding: 4px 6px; border-bottom: 1px solid var(--line-soft); background: var(--paper); flex-wrap: wrap; }
.fp-title { font-weight: 600; margin-right: 4px; }
.fp-page { height: 22px; max-width: 170px; border: 1px solid var(--line); background: var(--field); }
.fp-scroll { flex: 1; overflow: auto; padding: 16px; }
.fp-sheet { position: relative; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.25); margin: 0 auto; background-image: linear-gradient(rgba(10,110,209,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(10,110,209,.06) 1px, transparent 1px); background-size: 37.8px 37.8px; }
.fp-win { position: absolute; border: 1px solid #4b6a88; background: rgba(58,141,224,.06); cursor: pointer; user-select: none; }
.fp-win.wt-M { border-color: #0a6ed1; border-width: 1.5px; background: rgba(10,110,209,.08); }
.fp-win.wt-G, .fp-win.wt-A { border-style: dashed; }
.fp-win.sel { border-color: #e9730c; border-width: 2px; background: rgba(233,115,12,.08); z-index: 3; cursor: move; }
.fp-win.outside { border-color: #b00020; }
.fp-lab { position: absolute; left: 2px; top: 1px; font: 600 10px var(--f-ui); color: #2f4459; white-space: nowrap; overflow: hidden; max-width: calc(100% - 4px); }
.fp-gr { position: absolute; inset: 14px 2px 2px; display: flex; align-items: center; justify-content: center; gap: 4px; color: #5d6c79; font-size: 10px; overflow: hidden; }
.fp-bg { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center; padding: 6px; color: #8a96a3; font-size: 11px; border: 1px dashed #c3ccd5; }
.fp-h { position: absolute; width: 8px; height: 8px; background: #fff; border: 1.5px solid #e9730c; }
.fp-h-n { top: -5px; left: calc(50% - 4px); cursor: ns-resize; } .fp-h-s { bottom: -5px; left: calc(50% - 4px); cursor: ns-resize; }
.fp-h-e { right: -5px; top: calc(50% - 4px); cursor: ew-resize; } .fp-h-w { left: -5px; top: calc(50% - 4px); cursor: ew-resize; }
.fp-h-ne { right: -5px; top: -5px; cursor: nesw-resize; } .fp-h-sw { left: -5px; bottom: -5px; cursor: nesw-resize; }
.fp-h-nw { left: -5px; top: -5px; cursor: nwse-resize; } .fp-h-se { right: -5px; bottom: -5px; cursor: nwse-resize; }
.fp-legend { padding: 4px 8px; color: var(--muted); font-size: 11px; border-top: 1px solid var(--line-soft); font-variant-numeric: tabular-nums; }

/* ---------- Table Painter ---------- */
.tp { padding: 10px 6px; overflow: auto; height: 100%; }
.tp-ruler { position: relative; height: 18px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.tp-ruler span { position: absolute; font-size: 10px; color: var(--muted); transform: translateX(-50%); font-variant-numeric: tabular-nums; }
.tp-row { position: relative; height: 30px; margin-bottom: 4px; background: var(--paper-2); outline: 1px dashed var(--line); }
.tp-row.def { outline-color: var(--accent); }
.tp-row.too-wide { outline: 2px solid var(--err); }
.tp-cell { position: absolute; top: 0; bottom: 0; border: 1px solid var(--line); background: var(--paper); }
.tp-cell:hover { background: var(--accent-soft); }
.tp-name { position: absolute; left: 4px; top: 6px; font-size: 11px; font-weight: 600; color: var(--muted); white-space: nowrap; pointer-events: none; }
.tp-hdl { position: absolute; right: -4px; top: 0; bottom: 0; width: 8px; cursor: col-resize; z-index: 2; }
.tp-hdl:hover { background: var(--accent); opacity: .5; }
.tp-info { color: var(--muted); font-size: 11.5px; margin-top: 8px; max-width: 70ch; }

/* ---------- initial screen ---------- */
.initial { display: flex; flex: 1; gap: 0; min-height: 0; }
.init-left { flex: 0 0 470px; padding: 14px 16px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; }
.init-note { color: var(--muted); max-width: 60ch; line-height: 1.5; }
.init-note p { margin: 0 0 6px; }
.init-note code { font-size: 11.5px; background: var(--paper-2); padding: 0 3px; border-radius: 2px; }
.dropzone { border: 1.5px dashed var(--line); border-radius: 6px; padding: 18px; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--muted); cursor: pointer; }
.dropzone:hover, .dropzone.over { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.lib { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.lib-head { display: flex; flex-direction: column; gap: 6px; padding-bottom: 8px; border-bottom: 1px solid var(--line-soft); position: sticky; top: 0; background: var(--paper); z-index: 2; }
.lib-head .pane-title { border: 0; position: static; }
.seg { display: flex; gap: 0; padding: 0 8px; flex-wrap: wrap; }
.seg button { border: 1px solid var(--line); background: var(--paper-2); padding: 3px 10px; cursor: pointer; margin-right: -1px; }
.seg button:first-child { border-radius: 3px 0 0 3px; } .seg button:last-child { border-radius: 0 3px 3px 0; }
.seg button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.seg .cnt { opacity: .75; font-variant-numeric: tabular-nums; }
.lib-filter { margin: 0 8px; height: 26px; border: 1px solid var(--line); background: var(--field); border-radius: 3px; padding: 0 8px; max-width: 360px; }
.lib-scroll { flex: 1; overflow: auto; }
.lib-table { width: 100%; border-collapse: collapse; }
.lib-table th { text-align: left; font-weight: 500; color: var(--muted); padding: 4px 8px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--paper); }
.lib-table td { padding: 3px 8px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
.lib-table td:nth-child(3) { white-space: normal; color: var(--muted); }
.lib-table tbody tr { cursor: default; }
.lib-table tbody tr:hover td { background: var(--paper-2); }
.lib-table tbody tr.sel td { background: var(--sel); }
.lib-table .typ { margin-left: 6px; color: var(--muted); font-size: 11.5px; }
.pill { font-size: 10.5px; padding: 1px 6px; border-radius: 9px; text-transform: uppercase; letter-spacing: .04em; }
.pill.mod { background: var(--warn); color: var(--paper); } .pill.ex { border: 1px solid var(--line); color: var(--muted); }
@media (max-width: 900px) { .initial { flex-direction: column; overflow: auto; } .init-left { flex: none; border-right: 0; } .lib { flex: none; min-height: 60vh; } }

/* ---------- popups ---------- */
.ctx, .popup-list { position: fixed; z-index: 1000; background: var(--paper); border: 1px solid var(--line); box-shadow: 0 6px 18px rgba(0,0,0,.22); border-radius: 4px; padding: 3px 0; min-width: 190px; }
.ctx-item { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 6px; width: 100%; border: 0; background: none; text-align: left; padding: 4px 10px 4px 6px; cursor: pointer; }
.ctx-item:hover:not(:disabled), .ctx-item:focus { background: var(--accent-soft); outline: none; }
.ctx-item:disabled { opacity: .45; cursor: default; }
.ctx-item .ck { color: var(--muted); font-size: 11px; padding-left: 16px; }
.ctx-sep { height: 1px; background: var(--line-soft); margin: 3px 0; }
.popup-list { max-width: 420px; max-height: 60vh; display: flex; flex-direction: column; }
.pl-title { padding: 4px 10px; font-weight: 600; border-bottom: 1px solid var(--line-soft); }
.pl-filter { margin: 4px 8px; height: 24px; border: 1px solid var(--line); background: var(--field); padding: 0 6px; }
.pl-items { overflow: auto; }
.pl-item { display: flex; gap: 10px; width: 100%; border: 0; background: none; padding: 3px 10px; text-align: left; cursor: pointer; }
.pl-item b { font-family: var(--f-mono); font-weight: 600; min-width: 4ch; }
.pl-item span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl-item:hover, .pl-item:focus, .pl-item.on { background: var(--accent-soft); outline: none; }
.modal-back { position: fixed; inset: 0; background: rgba(15,25,35,.38); z-index: 900; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 14px 40px rgba(0,0,0,.35); max-width: min(560px, 100%); width: max-content; min-width: min(360px, 100%); max-height: 90vh; display: flex; flex-direction: column; }
.modal.wide { max-width: min(1000px, 100%); width: 100%; }
.modal-title { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 6px 12px; background: var(--shell); color: var(--shell-fg); border-radius: 6px 6px 0 0; font-weight: 600; }
.modal-title .tb-btn { color: var(--shell-fg); }
.modal-body { padding: 12px 14px; overflow: auto; min-height: 0; }
.modal-foot { display: flex; gap: 6px; padding: 8px 12px; border-top: 1px solid var(--line-soft); flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--paper-2); padding: 4px 12px; border-radius: 3px; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary .ic { --ic-line: var(--accent-ink); }
.confirm-text { margin: 4px 0; max-width: 56ch; line-height: 1.5; }
.prompt label, .sap-conn label { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; color: var(--muted); }
.prompt input, .sap-conn input { height: 26px; width: 100%; color: var(--fg); }
.sap-conn p { max-width: 62ch; color: var(--muted); margin: 0 0 12px; }
.fl-pick { max-height: 300px; border: 1px solid var(--line-soft); }
.dlg-scr { overflow: auto; }
.errlist table, .info-grid { width: 100%; border-collapse: collapse; }
.errlist th { text-align: left; font-weight: 500; color: var(--muted); border-bottom: 1px solid var(--line); padding: 4px 6px; }
.errlist td { padding: 4px 6px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
.errlist tr.link { cursor: pointer; }
.errlist tr.link:hover td { background: var(--accent-soft); }
.info-grid { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; }
.info-grid .k { color: var(--muted); }
.lang-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 4px 12px; }
pre.code { background: var(--paper-2); border: 1px solid var(--line-soft); padding: 10px; overflow: auto; max-height: 55vh; font-size: 12px; line-height: 1.45; }
.pat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.pat { display: flex; flex-direction: column; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--paper); padding: 8px; border-radius: 4px; cursor: pointer; }
.pat.on { border-color: var(--accent); background: var(--accent-soft); }
.pat-opt { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
.pat-opt input, .pat-opt select { height: 24px; }
.settings .tabpage { min-height: 200px; }
.about ul { padding-left: 18px; line-height: 1.6; max-width: 62ch; }

/* ---------- Style Builder ---------- */
.sb-preview { margin-top: 12px; border: 1px solid var(--line); border-radius: 3px; max-width: 560px; }
.sb-preview legend { font-weight: 600; padding: 0 4px; }

/* ---------- print preview ---------- */
.preview { flex: 1; padding: 12px 16px 40px; background: var(--bg); }
.pv-note { display: flex; gap: 6px; align-items: center; color: var(--muted); margin-bottom: 12px; max-width: 80ch; }
.pv-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.pv-cap { color: var(--muted); font-size: 11.5px; margin-top: 12px; }
.pv-page { position: relative; background: #fff; color: #111; box-shadow: 0 2px 8px rgba(0,0,0,.25); flex: none; }
.pv-win { position: absolute; overflow: hidden; outline: 1px dotted rgba(10,110,209,.25); }
.pv-text .te-preview, .pv-text { padding: 0; background: transparent; }
.pv-gr { display: flex; align-items: center; gap: 4px; color: #6b7d8c; font-size: 11px; padding: 4px; border: 1px dashed #c3ccd5; }
.pv-table { display: flex; flex-direction: column; }
.pv-row { display: flex; }
.pv-cell { flex: none; min-height: 1em; overflow: hidden; }

/* ---------- Change / Display mode ---------- */
:root { --mode-c: transparent; --mode-tint: var(--paper-2); --mode-ink: var(--muted); --mode-field: var(--field); --mode-edge: var(--line); }
:root[data-mode="show"] { --mode-c: #3a7bd5; --mode-tint: #eaf1fa; --mode-ink: #1f5fae; --mode-field: var(--field); --mode-edge: var(--line); }
:root[data-mode="edit"] { --mode-c: #7fb2ee; --mode-tint: #f3f8fe; --mode-ink: #3a78c4; --mode-field: #fbfdff; --mode-edge: #a9c8ee; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"])[data-mode="show"] { --mode-c: #4a9cf0; --mode-tint: #1a2838; --mode-ink: #8cc2ff; }
  :root:not([data-theme="light"])[data-mode="edit"] { --mode-c: #82c0ff; --mode-tint: #20344a; --mode-ink: #b3d9ff; --mode-field: #1a2735; --mode-edge: #44709c; }
}
:root[data-theme="dark"][data-mode="show"] { --mode-c: #4a9cf0; --mode-tint: #1a2838; --mode-ink: #8cc2ff; }
:root[data-theme="dark"][data-mode="edit"] { --mode-c: #82c0ff; --mode-tint: #20344a; --mode-ink: #b3d9ff; --mode-field: #1a2735; --mode-edge: #44709c; }

.titlebar, .apptb { background: var(--mode-tint); transition: background-color .45s ease, box-shadow .45s ease; }
.titlebar { display: flex; align-items: center; gap: 10px; box-shadow: inset 4px 0 0 var(--mode-c); }
.apptb { box-shadow: inset 4px 0 0 var(--mode-c); }
.systb { box-shadow: inset 0 3px 0 var(--mode-c); transition: box-shadow .45s ease; }
.mode-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
  padding: 2px 9px 2px 7px; border-radius: 999px; color: var(--mode-ink); border: 1px solid var(--mode-c);
  background: color-mix(in srgb, var(--mode-c) 14%, transparent);
  transition: color .45s ease, border-color .45s ease, background-color .45s ease, opacity .3s ease, transform .3s ease; }
:root:not([data-mode="show"]):not([data-mode="edit"]) .mode-badge { opacity: 0; transform: translateX(-6px); pointer-events: none; }
.mode-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--mode-c); transition: background-color .45s ease; }
:root[data-mode="edit"] .mode-dot { animation: mode-pulse 2.4s ease-in-out infinite; }
@keyframes mode-pulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--mode-c) 55%, transparent); } 50% { box-shadow: 0 0 0 4px transparent; } }

/* editable fields in Change mode: warm field color and edge; Display keeps the grey read-only look */
:root[data-mode="edit"] .dyn-field:not(.ro):not(:disabled), :root[data-mode="edit"] .tc-in:not(.ro), :root[data-mode="edit"] .dyn-wrap input:not(.ro) { background: var(--mode-field); border-color: var(--mode-edge); }
.dyn-field, .tc-in, .dyn-wrap input { transition: background-color .45s ease, border-color .45s ease; }
.tab.on, .tabpage { transition: background-color .45s ease, border-color .45s ease; }
:root[data-mode="edit"] .tabstrip .tab.on { box-shadow: inset 0 2px 0 var(--mode-c); }
:root[data-mode="show"] .tabstrip .tab.on { box-shadow: inset 0 2px 0 var(--mode-c); }

/* work area cross-fade on the switch */
#main.mode-swap { animation: mode-swap .42s ease; }
@keyframes mode-swap { from { opacity: .35; filter: saturate(.6); } to { opacity: 1; filter: none; } }
:root[data-mode="edit"] .dyn-field.req:not(.ro) { border-left-color: var(--warn); }

'use strict';

const NS_SF = 'urn:sap-com:SmartForms:2000:internal-structure';
const NS_ST = 'urn:sap-com:SmartForms:2000:style-internal-structure';
const NS_IFR = 'urn:sap-com:sdixml-ifr:2000';
const XML_DECL = '<?xml version="1.0" encoding="utf-8"?>';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- element names: "sf:X" = SmartForms/Style namespace, "X" = ifr namespace ---------- */
const X = {
  nameOf(el) { return el.namespaceURI === NS_IFR || !el.namespaceURI ? el.localName : 'sf:' + el.localName; },
  matches(el, name) {
    if (name.startsWith('sf:')) return el.localName === name.slice(3) && (el.namespaceURI === NS_SF || el.namespaceURI === NS_ST);
    return el.localName === name && (el.namespaceURI === NS_IFR || !el.namespaceURI);
  },
  kids(el, name) { return el ? [...el.children].filter(c => !name || X.matches(c, name)) : []; },
  kid(el, name) { if (!el) return null; for (const c of el.children) if (X.matches(c, name)) return c; return null; },
  path(el, ...names) { for (const n of names) { el = X.kid(el, n); if (!el) return null; } return el; },
  val(el, ...names) { const e = names.length ? X.path(el, ...names) : el; return e ? e.textContent : ''; },
  sfNs(el) { const r = (el.ownerDocument || el).documentElement; return r.namespaceURI; },
  mk(doc, name, sfNs) {
    if (name.startsWith('sf:')) return doc.createElementNS(sfNs || doc.documentElement.namespaceURI, 'sf:' + name.slice(3));
    return doc.createElementNS(NS_IFR, name);
  },
  /* path stack for ordering context: resets at sf:NODE */
  stack(el) {
    const out = [];
    for (let e = el; e && e.nodeType === 1; e = e.parentElement) {
      const n = X.nameOf(e);
      if (n === 'sf:NODE') { out.unshift('NODE'); break; }
      out.unshift(n);
    }
    return out;
  },
  orderFor(parent) {
    const st = X.stack(parent);
    const key = st.slice(-2).join('/');
    return ORDER[key] || ORDER[st[st.length - 1]] || null;
  },
  /* insert child respecting SAP element order */
  insertOrdered(parent, child) {
    const order = X.orderFor(parent);
    const cn = X.nameOf(child);
    let ref = null;
    if (order) {
      const idx = order.indexOf(cn);
      if (idx >= 0) {
        for (const sib of parent.children) {
          const si = order.indexOf(X.nameOf(sib));
          if (si > idx) { ref = sib; break; }
        }
      } else {
        ref = X.kid(parent, 'T_CAPTION') || X.kid(parent, 'T_TEXT') || null;
      }
    }
    parent.insertBefore(child, ref);
    return child;
  },
  ensure(parent, name) {
    let c = X.kid(parent, name);
    if (!c) c = X.insertOrdered(parent, X.mk(parent.ownerDocument, name, X.sfNs(parent)));
    return c;
  },
  ensurePath(el, ...names) { for (const n of names) el = X.ensure(el, n); return el; },
  /* set leaf value; '' or null removes the element (SDIXML omits initial values) */
  set(parent, name, v) {
    let c = X.kid(parent, name);
    if (v === '' || v === null || v === undefined || v === false) { if (c) c.remove(); return; }
    if (v === true) v = 'X';
    if (!c) c = X.insertOrdered(parent, X.mk(parent.ownerDocument, name, X.sfNs(parent)));
    if (c.textContent !== String(v)) c.textContent = String(v);
  },
  setPath(el, names, v) {
    const last = names[names.length - 1];
    if (v === '' || v === null || v === undefined || v === false) {
      const p = X.path(el, ...names.slice(0, -1)); if (p) X.set(p, last, ''); return;
    }
    X.set(X.ensurePath(el, ...names.slice(0, -1)), last, v);
  },
  remove(parent, name) { const c = X.kid(parent, name); if (c) c.remove(); },
  /* list of <item> rows -> plain objects (field order kept separately) */
  rows(listEl) { return X.kids(listEl, 'item'); },
  newItem(listEl, fields) {
    const it = X.mk(listEl.ownerDocument, 'item');
    listEl.appendChild(it);
    for (const [k, v] of Object.entries(fields)) if (v !== '' && v != null) X.set(it, k, v);
    return it;
  },
  setLines(listEl, lines) {
    while (listEl.firstChild) listEl.firstChild.remove();
    for (const l of lines) { const it = X.mk(listEl.ownerDocument, 'item'); if (l !== '') it.textContent = l; listEl.appendChild(it); }
  },
  lines(listEl) { return X.kids(listEl, 'item').map(i => i.textContent); },
};

function parseXml(text) {
  const doc = new DOMParser().parseFromString(String(text).replace(/^﻿/, ''), 'application/xml');
  const err = doc.getElementsByTagName('parsererror')[0];
  if (err) throw new Error('Not well-formed XML: ' + err.textContent.split('\n')[0].slice(0, 200));
  return doc;
}
/* Byte-faithful serializer: SAP writes ' and " in text content as entities. */
function serializeXml(doc) {
  let s = new XMLSerializer().serializeToString(doc);
  s = s.replace(/^<\?xml[^>]*\?>\s*/, '');
  s = s.replace(/>([^<]+)</g, (m, t) => '>' + t.replace(/'/g, '&apos;').replace(/"/g, '&quot;') + '<');
  return XML_DECL + s;
}

/* ---------- languages: SAP 1-char key <-> ISO ---------- */
const LANG = (() => {
  const pairs = '0 SR 1 ZH 2 TH 3 KO 4 RO 5 SL 6 HR 7 MS 8 UK 9 ET A AR B HE C CS D DE E EN F FR G EL H HU I IT J JA K DA L PL M ZF N NL O NO P PT Q SK R RU S ES T TR U FI V SV W BG X LT Y LV Z Z1 a AF b IS c CA d SH i ID 뢚 AZ 뢌 KK'.split(' ');
  const toIso = {}, toSap = {};
  for (let i = 0; i < pairs.length; i += 2) { toIso[pairs[i]] = pairs[i + 1]; toSap[pairs[i + 1]] = pairs[i]; }
  return { iso: k => toIso[k] || k, sap: iso => toSap[(iso || '').toUpperCase()] || iso };
})();

/* ---------- units ---------- */
const UNIT_CM = { CM: 1, MM: .1, IN: 2.54, PT: 2.54 / 72, TW: 2.54 / 1440 };
const UNITS_H = ['CH', 'CM', 'MM', 'IN', 'PT', 'TW'];
const UNITS_V = ['LN', 'CM', 'MM', 'IN', 'PT', 'TW'];
const UNITS_ALL = ['CH', 'LN', 'CM', 'MM', 'IN', 'PT', 'TW'];
function toCm(v, u, ctx) {
  const n = parseFloat(String(v).replace(',', '.')); if (!isFinite(n)) return 0;
  u = (u || 'CM').toUpperCase();
  if (u === 'CH') return n * 2.54 / (ctx?.cpi || 10);
  if (u === 'LN') return n * 2.54 / (ctx?.lpi || 6);
  return n * (UNIT_CM[u] ?? 1);
}
function fromCm(cm, u, ctx) {
  u = (u || 'CM').toUpperCase();
  if (u === 'CH') return cm / 2.54 * (ctx?.cpi || 10);
  if (u === 'LN') return cm / 2.54 * (ctx?.lpi || 6);

/* ---------- undo journal based on MutationObserver ---------- */
class Journal {
  constructor(doc, onChange) {
    this.doc = doc; this.onChange = onChange;
    this.undoStack = []; this.redoStack = [];

    this.mo.takeRecords();

      if (failed && recs.length) {
        /* PAI error: roll back the partial change, keep history clean */
        this.applying = true;
        try { this.revert(recs.map(Journal.snap)); } finally { this.mo.takeRecords(); this.applying = false; }
      } else if (recs.length && !this.applying) {
        this.undoStack.push({ label, recs: recs.map(Journal.snap) });

  }
  revert(recs) {
    for (let i = recs.length - 1; i >= 0; i--) {
      const r = recs[i];
      if (r.type === 'characterData') r.target.data = r.oldValue;
      else if (r.type === 'attributes') { if (r.oldValue === null) r.target.removeAttributeNS(r.attrNs, r.attr); else r.target.setAttributeNS(r.attrNs, r.attr, r.oldValue); }
      else {
        for (const n of r.added) if (n.parentNode === r.target) r.target.removeChild(n);
        const before = r.next && r.next.parentNode === r.target ? r.next : (r.prev && r.prev.parentNode === r.target ? r.prev.nextSibling : null);
