function graphicBinding(ctx, g, ens, { background = false } = {}) {
  const keyEl = () => X.kid(g(), 'GKEYBDS'), keyEns = () => X.ensure(ens(), 'GKEYBDS');
  const nm = B.sym(() => g(), () => ens(), ['GKEYBDS', 'NAME']);
  const ob = B.sym(() => g(), () => ens(), ['GKEYBDS', 'OBJECT']);
  const id = B.sym(() => g(), () => ens(), ['GKEYBDS', 'ID']);
  const bt = () => X.val(keyEl(), 'BTYPE');
  const ui = ctx.ui; ui.sym ||= {};
  const symOn = k => ui.sym[k] ?? (k === 'NAME' ? nm.isSym() : k === 'OBJECT' ? ob.isSym() : id.isSym());
  const res = {
    get: () => { const v = X.val(g(), 'RESOLUTION'); return v ? String(+v) : ''; },
    set: v => X.set(v === '' && !g() ? null : ens(), 'RESOLUTION', v === '' ? '' : String(parseInt(v, 10) || 0).padStart(4, '0')),
    values: () => VL.resolution,
  };
  const bgr = () => X.kid(g(), 'BGR_EXT'), bgrEns = () => X.ensure(ens(), 'BGR_EXT');
  const f = {
    'SSFSCREEN-GR_NAME': nm.static, 'SSFSCREEN-GR_NAM_SYM': nm.dyn,
    'SSFSCREEN-GR_OBJECT': ob.static, 'SSFSCREEN-GR_OBJ_SYM': ob.dyn,
    'SSFSCREEN-GR_ID': id.static, 'SSFSCREEN-GR_ID_SYM': id.dyn,
    'RSSCG-BTYPE_BMON': { get: () => bt() === 'BMON', set: () => X.set(keyEns(), 'BTYPE', 'BMON') },
    'RSSCG-BTYPE_BCOL': { get: () => bt() === 'BCOL', set: () => X.set(keyEns(), 'BTYPE', 'BCOL') },
    'SSFSCREEN-RB_SYM': { get: () => /^&/.test(bt()) || ui.btSym, set: () => { ui.btSym = true; } },
    'SSFSCREEN-BGR_SYM': { get: () => /^&/.test(bt()) ? bt() : '', set: v => { v = v.trim(); if (v && !/^&.*&$/.test(v)) v = '&' + v.replace(/&/g, '') + '&'; X.set(keyEns(), 'BTYPE', v || 'BMON'); }, lower: true },
    'RSSCG-RESOLUTION': res,
    'RSSCG-RESIDENT': B.flag(g, ens, 'RESIDENT'),
  };
  if (background) {
    Object.assign(f, {
      'SSFSCREEN-BGR_PRT2': { get: () => X.val(bgr(), 'PRINTOUT'), set: v => X.set(bgrEns(), 'PRINTOUT', v), values: () => VL.bgrPrint },
      'SSFSCREEN-BGR_HORIZ': { get: () => X.val(bgr(), 'ALIGN_H'), set: v => X.set(bgrEns(), 'ALIGN_H', v), values: () => [['', ''], ...VL.alignH] },
      'SSFSCREEN-WLEFT': B.dec(bgr, bgrEns, 'MARGINH'), 'SSFSCREEN-U_WLEFT': B.unit(bgr, bgrEns, 'U_MARGINH', VL.unitH),
      'SSFSCREEN-BGR_VERT': { get: () => X.val(bgr(), 'ALIGN_V'), set: v => X.set(bgrEns(), 'ALIGN_V', v), values: () => [['', ''], ...VL.alignV] },
      'SSFSCREEN-WTOP': B.dec(bgr, bgrEns, 'MARGINV'), 'SSFSCREEN-U_WTOP': B.unit(bgr, bgrEns, 'U_MARGINV', VL.unitV),
    });
  }
  return {
    f,
    fc: {
      SYM_NAME_ON: env => { ui.sym.NAME = true; env.rerender(); }, SYM_NAME_OFF: env => { ui.sym.NAME = false; env.rerender(); },
      SYM_OBJ_ON: env => { ui.sym.OBJECT = true; env.rerender(); }, SYM_OBJ_OFF: env => { ui.sym.OBJECT = false; env.rerender(); },
      SYM_ID_ON: env => { ui.sym.ID = true; env.rerender(); }, SYM_ID_OFF: env => { ui.sym.ID = false; env.rerender(); },
      SYM_BTYPE: env => { ui.btSym = false; env.rerender(); },
    },
    vis: el => {
      const pairs = { NAME: [['SSFSCREEN-GR_NAME', 'GR_NAME'], ['SSFSCREEN-GR_NAM_SYM', 'GR_NAM_SYM']], OBJECT: [['SSFSCREEN-GR_OBJECT', 'GR_OBJECT'], ['SSFSCREEN-GR_OBJ_SYM', 'GR_OBJ_SYM']], ID: [['SSFSCREEN-GR_ID', 'GR_ID'], ['SSFSCREEN-GR_ID_SYM', 'GR_ID_SYM']] };
      for (const [k, [st, dy]] of Object.entries(pairs)) {
        if (st.includes(el.n)) return !symOn(k);
        if (dy.includes(el.n)) return symOn(k);
      }
      if (el.n === 'SSFSCREEN-BGR_SYM') return /^&/.test(bt()) || !!ui.btSym;
      if (['SSFSCREEN-BGR_ORIG', 'SSFSCREEN-BGR_RESIZE', 'RSSCG-AUTOHEIGHT', 'TEXT_SIZE', '%#AUTOTEXT003'].includes(el.n)) return false;
      if (background && ['SSFSCREEN-WLEFT', 'SSFSCREEN-U_WLEFT'].includes(el.n)) return true;
      return undefined;
    },
    ro: el => (background && ['SSFSCREEN-WLEFT', 'SSFSCREEN-U_WLEFT'].includes(el.n) && !X.val(bgr(), 'ALIGN_H')) || (background && ['SSFSCREEN-WTOP', 'SSFSCREEN-U_WTOP'].includes(el.n) && !X.val(bgr(), 'ALIGN_V')),
  };
}

function addressBinding(ctx) {
  const n = ctx.node;
  const o = () => n.type === 'WI' ? n.innerObj : n.obj;
  const ui = ctx.ui; ui.sym ||= {};
  const pair = (field, el) => { const s = B.sym(o, o, [el]); return s; };
  const S = {
    ADDRNUM: pair('AD_ADDRNUM', 'NUMB'), PERSNUM: pair('AD_PERSNUM', 'PERSON'), MAXL: pair('AD_MAXL', 'LINES'), SCTRY: pair('AD_SCTRY', 'FRCOUNTRY'),
    LANGCN: pair('AD_LANGCN', 'LANG4CNAME'), RECLANG: pair('AD_RECLANG', 'LANG'), LPRIO: pair('AD_LPRIO', 'PRIORITY'),
  };
  const symOn = k => ui.sym[k] ?? S[k].isSym();
  const at = () => X.val(o(), 'ADDRTYPE'), dl = () => X.val(o(), 'DELIVERY');
  const f = {
    'SSFSCREEN-AD_TYPE1': { get: () => at() === '1', set: () => X.set(o(), 'ADDRTYPE', '1') },
    'SSFSCREEN-AD_TYPE2': { get: () => at() === '2', set: () => X.set(o(), 'ADDRTYPE', '2') },
    'SSFSCREEN-AD_TYPE3': { get: () => at() === '3', set: () => X.set(o(), 'ADDRTYPE', '3') },
    'SSFSCREEN-AD_TYPEDYN': { get: () => /^&/.test(at()) || ui.atSym, set: () => { ui.atSym = true; } },
    'SSFSCREEN-AD_TYPESYM': { get: () => /^&/.test(at()) ? at() : '', set: v => { v = v.trim(); if (v && !/^&.*&$/.test(v)) v = '&' + v.replace(/&/g, '') + '&'; X.set(o(), 'ADDRTYPE', v || '1'); }, lower: true },
    'SSFSCREEN-AD_1_PBOX': { get: () => dl() === 'P', set: () => X.set(o(), 'DELIVERY', 'P') },
    'SSFSCREEN-AD_1_STR': { get: () => dl() === 'S', set: () => X.set(o(), 'DELIVERY', 'S') },
    'SSFSCREEN-AD_1_DYN': { get: () => /^&/.test(dl()) || ui.dlSym, set: () => { ui.dlSym = true; } },
    'SSFSCREEN-AD_1_SYM': { get: () => /^&/.test(dl()) ? dl() : '', set: v => { v = v.trim(); if (v && !/^&.*&$/.test(v)) v = '&' + v.replace(/&/g, '') + '&'; X.set(o(), 'DELIVERY', v || 'P'); }, lower: true },
    'SSFSCREEN-AD_STDPAR': B.leaf(o, o, 'ADDRPAR', { values: APP.paraList(ctx.form, n) }),
    'SSFSCREEN-AD_CNINREC': B.flag(o, o, 'CNAMEINREC'),
    'SSFSCREEN-AD_NOUP': B.flag(o, o, 'NOUPCITY'),
  };
  const map = { ADDRNUM: ['SSFSCREEN-AD_ADDRNUM', 'SSFSCREEN-AD_AN_SYM', 'AD_ADDRNUM', 'AD_ADDRNUM_SYM'], PERSNUM: ['SSFSCREEN-AD_PERSNUM', 'SSFSCREEN-AD_PN_SYM', 'AD_PERSNUM', 'AD_PERSNUM_SYM'],
    MAXL: ['SSFSCREEN-AD_MAXL', 'SSFSCREEN-AD_ML_SYM', 'AD_MAXL', 'AD_MAXL_SYM'], SCTRY: ['SSFSCREEN-AD_SCTRY', 'SSFSCREEN-AD_SC_SYM', 'AD_SCTRY', 'AD_SCTRY_SYM'],
    LANGCN: ['SSFSCREEN-AD_LANGCN', 'SSFSCREEN-AD_LC_SYM', 'AD_LANGCN', 'AD_LANGCN_SYM'], RECLANG: ['SSFSCREEN-AD_RECLANG', 'SSFSCREEN-AD_RL_SYM', 'AD_RECLANG', 'AD_RECLANG_SYM'],
    LPRIO: ['SSFSCREEN-AD_LPRIO', 'SSFSCREEN-AD_LP_SYM', 'AD_LPRIO', 'AD_LPRIO_SYM'] };
  const fc = { CHECK: env => APP.checkNode(n, env), RB_ADDRTYPE: () => {}, RB_ADDR2: () => {} };
  const codes = { ADDRNUM: 'ADDRNUM', PERSNUM: 'PERSNUM', MAXL: 'MAXL', SCTRY: 'SCTRY', LANGCN: 'FIXL', RECLANG: 'RECL', LPRIO: 'PRIO' };
  for (const [k, [st, dy]] of Object.entries(map)) {
    f[st] = S[k].static; f[dy] = S[k].dyn;
    fc['SYM_' + codes[k] + '_ON'] = env => { ui.sym[k] = true; env.rerender(); };
    fc['SYM_' + codes[k] + '_OFF'] = env => { ui.sym[k] = false; env.rerender(); };
  }
  return {
    f, fc,
    vis: el => {
      for (const [k, [st, dy, bst, bdy]] of Object.entries(map)) {
        if (el.n === st || el.n === bst) return !symOn(k);
        if (el.n === dy || el.n === bdy) return symOn(k);
      }
      if (el.n === 'SSFSCREEN-AD_TYPESYM') return /^&/.test(at()) || !!ui.atSym;
      if (el.n === 'SSFSCREEN-AD_1_SYM') return /^&/.test(dl()) || !!ui.dlSym;
      return undefined;
    },
  };
}

function textBinding(ctx, dyn) {
  const n = ctx.node, o = () => n.obj, form = ctx.form;
  const ui = ctx.ui; ui.sym ||= {};
  const ttype = () => TEXT_TYPE[X.val(o(), 'TTYPE')] || 'E';
  const f = {
    'SSFSCREEN-TEXTTYPE': {
      get: ttype, values: () => VL.textType,
      set: v => {
        const cur = ttype(); if (v === cur) return;
        APP.needConfirm('ttype', 'Change Text Node', 'Do you want to change the type of the text node? The text of the node will be lost.');
        X.set(o(), 'TTYPE', TEXT_TYPE_XML[v]);
        for (const k of ['TEXT', 'T_TEXT', 'TKEY', 'REF_NAME', 'REF_LANG', 'REF_STYLE', 'IGNORE', 'TABLINE']) X.remove(o(), k);
        if (v === 'E') form.setTextLines(o(), [{ f: '*', t: '' }]);
        if (v === 'I') { X.setPath(o(), ['TKEY', 'OBJECT'], 'TEXT'); X.setPath(o(), ['TKEY', 'ID'], 'ST'); }
      },
    },
    'SSFSCREEN-TEXTAPPM': B.leaf(o, o, 'APPMODE', { values: VL.appmode }),
    'SSFSCREEN-INCL_IGNO': B.flag(o, o, 'IGNORE'),
    'SSFSCREEN-INCL_PARA': B.path(o, o, ['TKEY', 'PAR'], { values: APP.paraList(form, n) }),
    'SSFSCREEN-INCL_NPARA': B.path(o, o, ['TKEY', 'NEWPAR'], { values: APP.paraList(form, n) }),
    'SSFSCREEN-INCL_STYLE': B.flag(o, o, 'REF_STYLE'),
  };
  const fc = { CHECK: env => APP.checkNode(n, env), EDIT: env => APP.fullscreenText(n, env), INFO: env => env.msg('I', 'Include texts are maintained with transaction SO10') };
  let pairs = {};
  if (dyn === '1033') {
    const s = { NAME: B.sym(o, o, ['TKEY', 'NAME']), OBJ: B.sym(o, o, ['TKEY', 'OBJECT']), ID: B.sym(o, o, ['TKEY', 'ID']), LANG: B.sym(o, o, ['TKEY', 'LANG']) };
    Object.assign(f, { 'SSFSCREEN-INCL_NAME': s.NAME.static, 'SSFSCREEN-I_NAM_SYM': s.NAME.dyn, 'SSFSCREEN-INCL_OBJ': s.OBJ.static, 'SSFSCREEN-I_OBJ_SYM': s.OBJ.dyn,
      'SSFSCREEN-INCL_ID': s.ID.static, 'SSFSCREEN-I_ID_SYM': s.ID.dyn, 'SSFSCREEN-INCL_LANG': s.LANG.static, 'SSFSCREEN-I_LANG_SYM': s.LANG.dyn });
    f['SSFSCREEN-INCL_NAME'].lower = true; f['SSFSCREEN-INCL_LANG'] = { ...s.LANG.static, values: () => APP.langList() };
    pairs = { NAME: [s.NAME, 'SSFSCREEN-INCL_NAME', 'SSFSCREEN-I_NAM_SYM', 'I_NAME', 'I_NAM_SYM', 'NAME'], OBJ: [s.OBJ, 'SSFSCREEN-INCL_OBJ', 'SSFSCREEN-I_OBJ_SYM', 'I_OBJ', 'I_OBJ_SYM', 'OBJ'],
      ID: [s.ID, 'SSFSCREEN-INCL_ID', 'SSFSCREEN-I_ID_SYM', 'I_ID', 'I_ID_SYM', 'ID'], LANG: [s.LANG, 'SSFSCREEN-INCL_LANG', 'SSFSCREEN-I_LANG_SYM', 'I_LANG', 'I_LANG_SYM', 'LANG'] };
  }
  if (dyn === '1035' || dyn === '1037') {
    /* REF_LANG holds a 1-char language key or a field name without ampersands (e.g. SY-LANGU) */
    const refLang = {
      static: { get: () => { const v = X.val(o(), 'REF_LANG'); return v.length > 1 ? '' : v; }, set: v => X.set(o(), 'REF_LANG', v) },
      dyn: { get: () => { const v = X.val(o(), 'REF_LANG'); return v.length > 1 ? v : ''; }, set: v => X.set(o(), 'REF_LANG', v.trim().replace(/&/g, '').toUpperCase()), lower: false },
      isSym: () => X.val(o(), 'REF_LANG').length > 1,
    };
    const s = { NAME: B.sym(o, o, ['REF_NAME']), LANG: refLang };
    Object.assign(f, { 'SSFSCREEN-TNAME': { ...s.NAME.static, values: () => APP.textModules().map(t => [t, t]) }, 'SSFSCREEN-I_NAM_SYM': s.NAME.dyn,
      'SSFSCREEN-INCL_LANG': { ...s.LANG.static, values: () => APP.langList() }, 'SSFSCREEN-I_LANG_SYM': s.LANG.dyn });
    pairs = { NAME: [s.NAME, 'SSFSCREEN-TNAME', 'SSFSCREEN-I_NAM_SYM', 'I_NAME', 'I_NAM_SYM', 'NAME', 'BUTTON1', 'BUTTON2'], LANG: [s.LANG, 'SSFSCREEN-INCL_LANG', 'SSFSCREEN-I_LANG_SYM', 'I_LANG', 'I_LANG_SYM', 'LANG'] };
    if (dyn === '1037') { pairs.NAME = null; f['SSFSCREEN-I_NAM_SYM'] = s.NAME.dyn; }
    fc.PICK = env => APP.copyTextModule(n, env);
  }
  for (const [k, p] of Object.entries(pairs)) if (p) { fc[`SYM_${p[5]}_ON`] = env => { ui.sym[k] = true; env.rerender(); }; fc[`SYM_${p[5]}_OFF`] = env => { ui.sym[k] = false; env.rerender(); }; }
  const cust = {};
  if (dyn === '1032') cust.EDITOR_CUSTOM_CONTROL = textEditorCtrl(ctx, n);
  if (dyn === '1035') cust.EDITOR_CUSTOM_CONTROL = textEditorCtrl(ctx, n, { readonly: true, linesGetter: () => APP.textModuleLines(X.val(o(), 'REF_NAME')) });
  return {
    f, fc, cust,
    vis: el => {
      if (el.n === 'USE_FULL_SCREEN_TEXTEDITOR') return false;
      for (const [k, p] of Object.entries(pairs)) {
        if (!p) continue;
        const on = ui.sym[k] ?? p[0].isSym();
        if (el.n === p[1] || el.n === p[3]) return !on;
        if (el.n === p[2] || el.n === p[4]) return on;
        if (p[6] && el.n === p[6]) return !on;
        if (p[7] && el.n === p[7]) return on;
      }
      return undefined;
    },
  };
}

function eventBinding(ctx, which) {
  const ev = ctx.node, t = ev.parent, o = () => t.obj;
  if (which === 'H') {
    const hdr = () => X.val(o(), 'OTABHEADER');
    return { f: {
      'SSFSCREEN-OUT_HSTART': { get: () => ['A', 'B'].includes(hdr()), set: v => { const b = ['A', 'P'].includes(hdr()); X.set(o(), 'OTABHEADER', v && b ? 'A' : v ? 'B' : b ? 'P' : ''); } },
      'SSFSCREEN-OUT_HBREAK': { get: () => ['A', 'P'].includes(hdr()), set: v => { const s = ['A', 'B'].includes(hdr()); X.set(o(), 'OTABHEADER', v && s ? 'A' : v ? 'P' : s ? 'B' : ''); } },
    } };
  }
  const ftr = () => X.val(o(), 'OTABFOOTER');
  return { f: {
    'SSFSCREEN-OUT_FTOP': B.dec(o, o, 'FHEIGHT'), 'SSFSCREEN-OUT_FUTOP': B.unit(o, o, 'U_FHEIGHT', VL.unitV),
    'SSFSCREEN-OUT_FBREAK': { get: () => ['A', 'P'].includes(ftr()), set: v => { const e = ['A', 'E'].includes(ftr()); X.set(o(), 'OTABFOOTER', v && e ? 'A' : v ? 'P' : e ? 'E' : ''); } },
    'SSFSCREEN-OUT_FEND': { get: () => ['A', 'E'].includes(ftr()), set: v => { const b = ['A', 'P'].includes(ftr()); X.set(o(), 'OTABFOOTER', v && b ? 'A' : v ? 'E' : b ? 'P' : ''); } },
  } };
}

function dataBinding(ctx) {
  const n = ctx.node, o = () => n.obj, form = ctx.form;
  const dt = () => X.val(o(), 'DATATYPE');
  const where = condTable(() => X.kid(o(), 'WCOND'), () => X.ensure(o(), 'WCOND'), ctx);
  /* sort criteria with "event on sort begin/end" nodes */
  const evFor = (field, t) => n.children.find(c => c.type === 'EV' && c.sub === t && X.val(c.obj, 'SFIELD') === field);
  const setEv = (field, t, on) => {
    const e = evFor(field, t);
    if (on && !e) {
      const node = form.eventNode(t, field);
      const succ = n.succ || X.ensure(n.el, 'sf:SUCC');
      const it = X.mk(form.doc, 'sf:item'); it.appendChild(node); succ.appendChild(it);
    }
    if (!on && e) form.removeNode(e);
  };
  const sort = itemTable(() => X.kid(o(), 'SORT'), () => X.ensure(o(), 'SORT'), {
    'G_SORT_FIELDS-NAME': { get: r => X.val(r, 'NAME'), set: (r, v) => { v = v.toUpperCase(); const old = X.val(r, 'NAME'); X.set(r, 'NAME', v); for (const t of ['S', 'E']) { const e = evFor(old, t); if (e) X.set(e.obj, 'SFIELD', v); } } },
    'G_SORT_FIELDS-ASCENDING': { get: r => X.val(r, 'DESCENDING') !== 'X', set: (r, v) => { if (v) { X.set(r, 'ASCENDING', 'X'); X.set(r, 'DESCENDING', ''); } } },
    'G_SORT_FIELDS-DESCENDING': { get: r => X.val(r, 'DESCENDING') === 'X', set: (r, v) => { if (v) { X.set(r, 'DESCENDING', 'X'); X.set(r, 'ASCENDING', ''); } } },
    'G_SORT_FIELDS-ATNEW': { get: r => X.val(r, 'ATNEW') === 'X', set: (r, v) => { X.set(r, 'ATNEW', v ? 'X' : ''); setEv(X.val(r, 'NAME'), 'S', v); } },
    'G_SORT_FIELDS-ATEND': { get: r => X.val(r, 'ATEND') === 'X', set: (r, v) => { X.set(r, 'ATEND', v ? 'X' : ''); setEv(X.val(r, 'NAME'), 'E', v); } },
  }, { init: it => X.set(it, 'ASCENDING', 'X') });
  const rmS = sort.remove; sort.remove = idxs => { const rows = sort.rows(); for (const i of idxs) for (const t of ['S', 'E']) setEv(X.val(rows[i], 'NAME'), t, false); rmS(idxs); };
  const codes = tcCodes('TC_OUTPUT_WHERE', where, ctx, {
    TC_CONDOR: env => env.pai('Insert OR', () => { const s = [...env.sel('TC_OUTPUT_WHERE')]; const at = s.length ? s[0] : where.rows().length; const l = X.ensure(o(), 'WCOND'); const it = X.mk(l.ownerDocument, 'item'); l.insertBefore(it, where.rows()[at] || null); X.set(it, 'LOP', 'OR'); where.fixLop(); }),
    TC_INSERT_SORT: env => env.pai('Insert sort criterion', () => { const s = [...env.sel('TC_SORT_FIELDS')]; sort.insertAt(s.length ? s[0] : sort.rows().length); }),
    TC_DELETE_SORT: env => { const s = [...env.sel('TC_SORT_FIELDS')]; if (!s.length) return env.msg('W', 'Select a sort criterion'); env.pai('Delete sort criterion', () => sort.remove(s)); env.sel('TC_SORT_FIELDS').clear(); },
    CHECK: env => APP.checkNode(n, env),
    DROP: env => env.rerender(),
  });
  return {
    f: {
      'SSFSCREEN-OUT_DO': { get: () => dt() === 'D', set: v => X.set(o(), 'DATATYPE', v ? 'D' : (n.sub === 'L' || n.sub === 'C' ? 'L' : '')) },
      'SSFSCREEN-OUT_LOOP': { get: () => dt() === 'L', set: v => X.set(o(), 'DATATYPE', v ? 'L' : '') },
      'SSFSCREEN-OUT_TNAME': B.leaf(o, o, 'TABNAME', { in: v => v.toUpperCase() }),
      'SSFSCREEN-OUT_TTYPE': B.leaf(o, o, 'TABHTYPE', { values: VL.tabhtype }),
      'SSFSCREEN-OUT_THEAD': B.leaf(o, o, 'TABHEADER', { in: v => v.toUpperCase() }),
      'SSFSCREEN-OUT_FLINE': B.leaf(o, o, 'FIRSTLINE', { in: v => v === '' ? '' : String(parseInt(v, 10) || 0).padStart(10, '0'), out: v => v ? String(+v) : '' }),
      'SSFSCREEN-OUT_LLINE': B.leaf(o, o, 'LASTLINE', { in: v => v === '' ? '' : String(parseInt(v, 10) || 0).padStart(10, '0'), out: v => v ? String(+v) : '' }),
      'SSFSCREEN-SORTEXIST': B.flag(o, o, 'SORTEXIST'),
    },
    tc: { TC_OUTPUT_WHERE: where, TC_SORT_FIELDS: sort },
    fc: codes,
    ro: el => ['SSFSCREEN-OUT_TNAME', 'SSFSCREEN-OUT_TTYPE', 'SSFSCREEN-OUT_THEAD', 'SSFSCREEN-OUT_FLINE', 'SSFSCREEN-OUT_LLINE'].includes(el.n) && dt() !== 'L',
    vis: el => (n.sub === 'C' && ['FRAME1', 'SSFSCREEN-OUT_DO'].includes(el.n)) ? false : undefined,
  };
}

/* a table line's cells follow its line type */
function syncRowCells(form, row, table, lineType) {
  if (!table) return;
  const want = cellsOf(table.obj, lineType).length;
  const cells = row.children.filter(c => c.kind === 'SE-E');
  if (cells.length > want) {
    APP.needConfirm('ltype', 'Change Line Type', `Line type ${lineType} has ${want} column(s). ${cells.length - want} cell node(s) and their content will be deleted. Do you want to change the line type?`);
    for (const c of cells.slice(want)) form.removeNode(c);
  }
  for (let i = cells.length; i < want; i++) form.insertNodeEl(form.createNode('SEE', row), row);
}

/* =====================================================================
   check.js — form check (Form > Check / node Check), rename of
   interface parameters / global data with usage replacement, and the
   ABAP call snippet of Environment > Function Module Name.
   ===================================================================== */
'use strict';

const Check = {
  SYS: new Set(['SFSY', 'SY', 'SYST', 'SPACE', 'TEXT']),
  /* names a text or condition can refer to */
  knownNames(form) {
    const s = new Set(Check.SYS);
    for (const l of ['INTERFACE', 'GDATA', 'FSYMBOLS']) for (const i of X.kids(X.kid(form.root, l), 'item')) s.add(X.val(i, 'NAME').toUpperCase());
    for (const n of form.all) if (n.type === 'SE') { const h = X.val(n.obj, 'TABHEADER'); if (h) s.add(h.toUpperCase()); }
    /* variables declared inside program lines / initialization (DATA x / FIELD-SYMBOLS <x>) */
    const decl = lines => { for (const l of lines) { const m = /^\s*(?:DATA|STATICS|CONSTANTS|FIELD-SYMBOLS)\s*:?\s*(<?[A-Z0-9_]+>?)/i.exec(l); if (m) s.add(m[1].toUpperCase()); } };
    decl(X.lines(X.kid(form.root, 'GCODING')));
    for (const n of form.all) if (n.type === 'CO') decl(X.lines(X.kid(n.obj, 'CODE')));
    return s;
  },
  rootOf(field) { return field.replace(/^&|&$/g, '').replace(/\(.*$/, '').replace(/[+](\d+)$/, '').split(/[-+(]/)[0].toUpperCase(); },
  run(form, scope = null) {
    const out = [];
    const E = (node, text) => out.push({ type: 'E', el: node?.el || null, text });
    const W = (node, text) => out.push({ type: 'W', el: node?.el || null, text });
    const known = Check.knownNames(form);
    const seenEl = new Set();
    const nodes = (scope ? [scope, ...form.all.filter(n => n.ancestors().includes(scope))] : form.all).filter(n => { if (seenEl.has(n.el)) return false; seenEl.add(n.el); return true; });
    if (!scope && !form.isTextModule) {
      /* interface */
      const names = new Map();
      for (const i of X.kids(X.kid(form.root, 'INTERFACE'), 'item')) {
        const nm = X.val(i, 'NAME'), io = X.val(i, 'IOTYPE');
        if (!nm) { E(null, 'Form interface: parameter without a name'); continue; }
        if (names.has(nm)) E(null, `Form interface: parameter ${nm} is defined twice`); names.set(nm, 'I');
        if (io !== 'X' && !X.val(i, 'TYPENAME') && !['TYPE ANY', 'TYPE ANY TABLE', 'TYPE STANDARD TABLE'].includes(X.val(i, 'TYPING')) && X.val(i, 'TYPING')) E(null, `Form interface: parameter ${nm} has no type (C20 Type specification required)`);
        if (X.val(i, 'TYPING') === 'TYPE REF TO' && io === 'T') E(null, `Form interface: table parameter ${nm} cannot be typed TYPE REF TO`);
      }
      for (const i of X.kids(X.kid(form.root, 'GDATA'), 'item')) {
        const nm = X.val(i, 'NAME');
        if (!nm) { E(null, 'Global data: variable without a name'); continue; }
        if (names.has(nm)) E(null, `Global data: ${nm} already exists ${names.get(nm) === 'I' ? 'in the form interface' : 'in global data'}`); names.set(nm, 'G');
        if (!X.val(i, 'TYPENAME')) E(null, `Global data: variable ${nm} has no type`);
        if (X.val(i, 'CONSTANT') === 'X' && !X.val(i, 'DEFAULTVAL')) E(null, `Global data: constant ${nm} needs a default value`);
      }
      for (const i of X.kids(X.kid(form.root, 'FSYMBOLS'), 'item')) if (!/^<[A-Z0-9_]+>$/i.test(X.val(i, 'NAME'))) E(null, `Field symbols: ${X.val(i, 'NAME')} must be written as <NAME> (C17)`);
      /* ABAP areas */
      for (const [list, what] of [['GTYPES', 'Global Definitions - Types'], ['GCODING', 'Global Definitions - Initialization'], ['FCODING', 'Global Definitions - Form Routines']]) {
        const r = AbapEditor.check(X.lines(X.kid(form.root, list)));
        if (!r.ok) E(null, `${what}: ${r.msg}`);
      }
      /* pages / windows */
      const pages = form.pages;
      if (!pages.length) E(null, 'The form has no page');
      const pnames = new Set(pages.map(p => p.name));
      const mains = new Set(form.all.filter(n => n.type === 'WI' && n.sub === 'M').map(n => n.name));
      if (!mains.size) W(null, 'The form has no main window');

      for (const p of pages) {
        const nx = X.val(p.obj, 'NEXTPAGE', 'INAME');
        if (nx && !pnames.has(nx)) E(p, `Page ${p.name}: next page ${nx} does not exist`);
        if (!nx) W(p, `Page ${p.name}: no next page specified`);
        const { w, h } = form.pageSize(p);
        for (const win of p.children.filter(c => c.type === 'WI')) {
          const oa = win.outattr; if (!oa) continue;
          const g = k => toCm(X.val(oa, k) || 0, X.val(oa, 'U_' + k) || 'CM', form.ctx);
          if (g('WLEFT') + g('WWIDTH') > w + 0.005 || g('WTOP') + g('WHEIGHT') > h + 0.005) W(win, `Window ${win.name} on page ${p.name} lies outside the page`);
          if (g('WWIDTH') <= 0 || g('WHEIGHT') <= 0) E(win, `Window ${win.name} on page ${p.name} has no size`);
        }
        const mw = p.children.filter(c => c.type === 'WI' && c.sub === 'M');
        if (mw.length > 1) E(p, `Page ${p.name} contains more than one main window`);
      }
      /* main window must have the same width on all pages */
      const mwW = new Set(form.all.filter(n => n.type === 'WI' && n.sub === 'M' && n.outattr).map(n => toCm(X.val(n.outattr, 'WWIDTH'), X.val(n.outattr, 'U_WWIDTH'), form.ctx).toFixed(2)));
      if (mwW.size > 1) W(null, 'The main window has different widths on different pages');
    }
    for (const n of nodes) {
      const o = n.obj;
      if (typeof boxLocked === 'function' && boxLocked(n) && hasBox(n)) E(n, `${n.name}: ${BOX_IN_TABLE} (at runtime: SSFCOMPOSER 197 "Table processing not allowed; frames are active")`);
      /* conditions */
      for (const c of [n.cond, n.type === 'CD' ? o : null]) {
        if (!c) continue;
        for (const r of X.kids(X.kid(c, 'COND'), 'item')) {
          if (X.val(r, 'LOP') === 'OR' && !X.kid(r, 'COP')) continue;
          if (!X.val(r, 'OP1')) E(n, `${n.name}: condition without a field name`);
          const f1 = X.val(r, 'OP1'); if (f1 && !/^['\d]/.test(f1) && !known.has(Check.rootOf(f1))) W(n, `${n.name}: field ${f1} in condition is unknown`);
        }
        const pg = X.val(c, 'OCOND', 'PAGENAME', 'INAME'); if (pg && !form.pages.some(p => p.name === pg)) E(n, `${n.name}: condition refers to unknown page ${pg}`);
      }
      if (n.type === 'TI') {
        const t = X.val(o, 'TTYPE');
        if (t === 'I' && !X.val(o, 'TKEY', 'NAME')) E(n, `Text ${n.name}: include text has no name`);
        if (t === 'R' && !X.val(o, 'REF_NAME')) E(n, `Text ${n.name}: text module name is missing`);
        if (t === 'R' && X.val(o, 'REF_NAME') && !/^&/.test(X.val(o, 'REF_NAME')) && APP.lib.size && !APP.libGet('TM', X.val(o, 'REF_NAME'))) W(n, `Text ${n.name}: text module ${X.val(o, 'REF_NAME')} is not in the library`);
        if (t === 'D' && !X.val(o, 'REF_NAME')) E(n, `Text ${n.name}: dynamic text needs a field name`);
        if (!t) {
          for (const l of form.textLines(o)) {
            for (const m of (l.t || '').matchAll(/&([^&\s]+)&/g)) {
              const root = Check.rootOf(m[1]);
              if (root && !known.has(root) && !/^\d/.test(root)) W(n, `Text ${n.name}: field &${m[1]}& is not defined`);
            }
            const opens = ((l.t || '').match(/<[A-Z0-9_]{1,2}>/g) || []).length, closes = ((l.t || '').match(/<\/>/g) || []).length;
            if (closes > opens) W(n, `Text ${n.name}: character format end </> without start`);
          }
        }
      }
      if (n.type === 'CO') {
        const r = AbapEditor.check(X.lines(X.kid(o, 'CODE')));
        if (!r.ok) E(n, `Program lines ${n.name}: ${r.msg}`);
        for (const p of X.kids(X.kid(o, 'PLIST'), 'item')) { const v = X.val(p, 'OPD'); if (v && !known.has(Check.rootOf(v))) E(n, `Program lines ${n.name}: ${X.val(p, 'OUTIN') === 'O' ? 'output' : 'input'} parameter ${v} is not defined`); }
      }
      if (n.type === 'CM') {
        if (X.val(o, 'NEWPAGE') === 'X') {
          const pg = X.val(o, 'PAGENAME', 'INAME');
          if (pg && !form.pages.some(p => p.name === pg)) E(n, `Command ${n.name}: page ${pg} does not exist`);
          if (n.window && n.window.sub !== 'M') E(n, `Command ${n.name}: no new page allowed in secondary window (C21)`);
          if (n.ancestors().some(a => a.kind === 'SE-C')) E(n, `Command ${n.name}: no new page allowed in table (C22)`);
        }
      }
      if (n.type === 'SE') {
        const dt = X.val(o, 'DATATYPE');
        if (dt === 'L') {
          if (!X.val(o, 'TABNAME')) E(n, `${n.info.label} ${n.name}: internal table is missing`);
          else if (!known.has(Check.rootOf(X.val(o, 'TABNAME')))) W(n, `${n.info.label} ${n.name}: internal table ${X.val(o, 'TABNAME')} is not defined`);
          if (!X.val(o, 'TABHEADER')) E(n, `${n.info.label} ${n.name}: work area / field symbol is missing`);
        }
        if (n.sub === 'C' || n.sub === 'S') {
          const tw = toCm(X.val(o, 'WIDTH') || 0, X.val(o, 'U_WIDTH') || 'CM', form.ctx);
          const ltypes = n.sub === 'C' ? X.kids(X.kid(o, 'DYNLINES'), 'item') : X.kids(X.kid(o, 'STATLINES'), 'item');
          if (!ltypes.length) E(n, `${n.info.label} ${n.name}: no line type defined`);
          for (const lt of ltypes) {
            const nm = X.val(lt, 'NAME');
            const cells = cellsOf(o, nm);
            if (!cells.length && !X.val(lt, 'REFERENCE')) E(n, `${n.info.label} ${n.name}: line type ${nm} has no cells`);
            const sum = cells.reduce((s, c) => s + toCm(X.val(c, 'CWIDTH') || 0, X.val(c, 'U_CWIDTH') || 'CM', form.ctx), 0);
            if (sum > tw + 0.005) E(n, `${n.info.label} ${n.name}: line type ${nm} (${sum.toFixed(2)} cm) is wider than the table (${tw.toFixed(2)} cm)`);
            else if (sum < tw - 0.005 && cells.length) W(n, `${n.info.label} ${n.name}: line type ${nm} (${sum.toFixed(2)} cm) is narrower than the table (${tw.toFixed(2)} cm)`);
          }
          if (n.sub === 'C' && !ltypes.some(l => X.val(l, 'DEFAULTVAL') === 'X')) W(n, `Table ${n.name}: no default line type`);
        }
        if (n.sub === 'R') {
          const t = n.ancestors().find(a => a.kind === 'SE-C');
          const lt = X.val(n.outattr, 'T_LINETYPE');
          if (!lt) E(n, `Line ${n.name}: no line type assigned`);
          else if (t && !lineTypes(t.obj).includes(lt)) E(n, `Line ${n.name}: line type ${lt} does not exist in table ${t.name}`);
          else if (t && cellsOf(t.obj, lt).length !== n.children.filter(c => c.kind === 'SE-E').length) E(n, `Line ${n.name}: number of cells differs from line type ${lt}`);
          if (!t) E(n, `Line ${n.name} is not inside a table`);
        }
        for (const c of X.kids(X.kid(o, 'CALC'), 'item')) {
          if (!X.val(c, 'SOURCENAME') || !X.val(c, 'TARGETNAME')) E(n, `${n.name}: calculation needs a field and a target field`);
          else if (!known.has(Check.rootOf(X.val(c, 'TARGETNAME')))) W(n, `${n.name}: target field ${X.val(c, 'TARGETNAME')} of the calculation is not defined`);
        }
      }
      if (n.type === 'GR' || (n.type === 'WI' && n.sub === 'G')) {
        const g = n.type === 'GR' ? o : n.innerObj;
        if (!X.val(g, 'GKEYBDS', 'NAME')) E(n, `Graphic ${n.name}: no graphic name`);
      }
      if ((n.type === 'AD' || (n.type === 'WI' && n.sub === 'A')) && !X.val(n.type === 'AD' ? o : n.innerObj, 'NUMB')) E(n, `Address ${n.name}: address number is missing`);
    }
    return out;
  },

  /* ---------- rename of an interface / global data name everywhere ---------- */
  renameField(form, from, to) {
    const re = new RegExp(`(^|[^A-Za-z0-9_<>-])${from.replace(/[<>]/g, m => '\\' + m)}(?=$|[^A-Za-z0-9_])`, 'gi');
    const reAmp = new RegExp(`&${from.replace(/[<>]/g, m => '\\' + m)}(?=[&+(-])`, 'gi');
    let count = 0;
    const fix = (el, amp) => {
      const v = el.textContent; let nv = amp ? v.replace(reAmp, () => { count++; return '&' + to; }) : v.replace(re, (m, p) => { count++; return p + to; });
      if (nv !== v) el.textContent = nv;
    };
    const exact = el => { const v = el.textContent; const r = new RegExp(`^${from.replace(/[<>]/g, m => '\\' + m)}(?=$|[-+(])`, 'i'); if (r.test(v)) { el.textContent = v.replace(r, to); count++; } };
    for (const el of form.doc.getElementsByTagNameNS(NS_IFR, '*')) {
      const n = el.localName, p = el.parentElement?.parentElement?.localName;
      if (n === 'TDLINE') fix(el, true);
      else if (n === 'item' && ['CODE', 'GCODING', 'FCODING', 'GTYPES'].includes(el.parentElement?.localName) && !el.children.length) fix(el, false);
      else if (['OP1', 'OP2', 'OPD', 'TABNAME', 'TABHEADER', 'SOURCENAME', 'TARGETNAME', 'SFIELD', 'VALUE', 'UNIT'].includes(n)) exact(el);
      else if (n === 'NAME' && p === 'SORT') exact(el);
      else if (['NAME', 'ID', 'OBJECT', 'LANG', 'NUMB', 'PERSON', 'LINES', 'ADDRTYPE', 'REF_NAME', 'BTYPE'].includes(n) && /&/.test(el.textContent)) fix(el, true);
      else if (n === 'REF_LANG') exact(el);
    }
    return count;
  },

  /* ---------- ABAP call template (Environment > Function Module Name) ---------- */
  callSnippet(form) {
    const name = form.name;
    const itf = X.kids(X.kid(form.root, 'INTERFACE'), 'item');
    const std = new Set(['ARCHIVE_INDEX', 'ARCHIVE_INDEX_TAB', 'ARCHIVE_PARAMETERS', 'CONTROL_PARAMETERS', 'MAIL_APPL_OBJ', 'MAIL_RECIPIENT', 'MAIL_SENDER', 'OUTPUT_OPTIONS', 'USER_SETTINGS', 'DOCUMENT_OUTPUT_INFO', 'JOB_OUTPUT_INFO', 'JOB_OUTPUT_OPTIONS']);
    const own = io => itf.filter(i => X.val(i, 'IOTYPE') === io && X.val(i, 'STANDARD') !== 'X' && !std.has(X.val(i, 'NAME')));
    const pad = (s, n) => s + ' '.repeat(Math.max(1, n - s.length));
    const w = Math.max(20, ...itf.map(i => X.val(i, 'NAME').length + 2));
    const L = [];
    L.push(`DATA: lv_fm_name TYPE rs38l_fnam.`, ``);
    L.push(`CALL FUNCTION 'SSF_FUNCTION_MODULE_NAME'`, `  EXPORTING`, `    formname           = '${name}'`, `  IMPORTING`, `    fm_name            = lv_fm_name`, `  EXCEPTIONS`, `    no_form            = 1`, `    no_function_module = 2`, `    OTHERS             = 3.`, `IF sy-subrc <> 0.`, `  MESSAGE ID sy-msgid TYPE sy-msgty NUMBER sy-msgno WITH sy-msgv1 sy-msgv2 sy-msgv3 sy-msgv4.`, `ENDIF.`, ``);
    L.push(`CALL FUNCTION lv_fm_name`);
    const imp = own('I'), exp = own('E'), tab = own('T');
    L.push(`  EXPORTING`, `    ${pad('control_parameters', w)}= ls_control`, `    ${pad('output_options', w)}= ls_options`, `    ${pad('user_settings', w)}= abap_true`);
    for (const i of imp) L.push(`${X.val(i, 'OPTIONAL') === 'X' || X.val(i, 'DEFAULTVAL') ? '*' : ' '}   ${pad(X.val(i, 'NAME').toLowerCase(), w)}= ${'"' + ' ' + X.val(i, 'TYPING') + ' ' + X.val(i, 'TYPENAME')}`);
    L.push(`  IMPORTING`, `    ${pad('job_output_info', w)}= ls_job_info`);
    for (const i of exp) L.push(`    ${pad(X.val(i, 'NAME').toLowerCase(), w)}= "${X.val(i, 'TYPING')} ${X.val(i, 'TYPENAME')}`);
    if (tab.length) { L.push(`  TABLES`); for (const i of tab) L.push(`${X.val(i, 'OPTIONAL') === 'X' ? '*' : ' '}   ${pad(X.val(i, 'NAME').toLowerCase(), w)}= "${X.val(i, 'TYPING')} ${X.val(i, 'TYPENAME')}`); }
    L.push(`  EXCEPTIONS`);
    const exc = itf.filter(i => X.val(i, 'IOTYPE') === 'X');
    exc.forEach((i, k) => L.push(`    ${pad(X.val(i, 'NAME').toLowerCase(), w)}= ${k + 1}`));
    L.push(`    ${pad('OTHERS', w)}= ${exc.length + 1}.`);
    return L.join('\n');
  },
};

/* =====================================================================
   preview.js — layout preview of a form (static approximation of the
   print preview): pages, windows at their positions, texts with the
   style's paragraph/character formats, tables with their line types.
   Fields are shown as &FIELD& because no data is passed.
   ===================================================================== */
'use strict';

const Preview = {
  render(form) {
    const wrap = document.createElement('div'); wrap.className = 'pv-wrap';
    const ctx = form.ctx;
    const pxcm = 37.8;
    for (const page of form.pages) {
      const { w, h, format } = form.pageSize(page);
      const sh = document.createElement('div'); sh.className = 'pv-page'; sh.style.width = w * pxcm + 'px'; sh.style.height = h * pxcm + 'px';
      const cap = document.createElement('div'); cap.className = 'pv-cap'; cap.textContent = `${page.name} · ${page.caption} · ${format}`; wrap.appendChild(cap);
      for (const win of page.children.filter(c => c.type === 'WI')) {
        const oa = win.outattr; if (!oa) continue;
        const g = k => toCm(X.val(oa, k) || 0, X.val(oa, 'U_' + k) || 'CM', ctx);
        const d = document.createElement('div'); d.className = 'pv-win';
        d.style.left = g('WLEFT') * pxcm + 'px'; d.style.top = g('WTOP') * pxcm + 'px'; d.style.width = g('WWIDTH') * pxcm + 'px'; d.style.height = g('WHEIGHT') * pxcm + 'px';
        Preview.box(d, oa);
        d.title = win.name;
        const style = APP.styleFor(form, win);
        if (win.sub === 'G') d.appendChild(Preview.graphic(win.innerObj));
        else if (win.sub === 'A') d.appendChild(Preview.address());
        else for (const c of win.children) Preview.node(c, d, form, style);
        sh.appendChild(d);
      }
      wrap.appendChild(sh);
    }
    return wrap;
  },
  rgb(c, def) { return c ? `rgb(${+X.val(c, 'RED') || 0},${+X.val(c, 'GREEN') || 0},${+X.val(c, 'BLUE') || 0})` : def; },
  /* Box and Shading of an output attribute: frame lines with thickness / color / spacing,
     shading color mixed with white by the saturation (WSHADING 0..100) */
  box(d, oa) {
    if (!oa) return false;
    let any = false;
    for (const [s, css] of [['LEFT', 'Left'], ['TOP', 'Top'], ['RIGHT', 'Right'], ['BOTTOM', 'Bottom']]) {
      const a = X.path(oa, 'BORDER', s + 'ATTR');
      const dist = a ? toCm(X.val(a, 'DISTANCE') || 0, X.val(a, 'DISTANCEU') || 'CM') * 37.8 : 0;
      if (X.val(oa, 'BORDER', s + 'LINE') !== 'X') { if (dist) { d.style['padding' + css] = dist + 'px'; any = true; } continue; }
      const t = toCm(X.val(a, 'THICKNESS') || 0, X.val(a, 'THICKNESSU') || 'PT') * 37.8;
      d.style['border' + css] = `${Math.max(1, Math.round(t))}px solid ${Preview.rgb(X.kid(a, 'COLOR'), '#000')}`;
      if (dist) d.style['padding' + css] = dist + 'px';
      any = true;
    }
    const sh = +X.val(oa, 'WSHADING') || 0;
    if (sh) { d.style.background = `color-mix(in srgb, ${Preview.rgb(X.kid(oa, 'SHADINGCOL'), '#000')} ${Math.min(100, sh)}%, #fff)`; any = true; }
    return any;
  },
  /* template / table cell: frame lines and fill color of the pattern */
  cell(d, c) {
    const bi = X.kids(X.kid(c, 'BORDERS'), 'item')[0];
    if (!bi) return;
    for (const [s, css, col] of [['LLEFT', 'borderLeft', 'CLEFT'], ['LTOP', 'borderTop', 'CTOP'], ['LRIGHT', 'borderRight', 'CRIGHT'], ['LBOTTOM', 'borderBottom', 'CBOTTOM']]) {
      const th = parseFloat(X.val(bi, s));
      if (th > 0) d.style[css] = `${Math.max(1, Math.round(toCm(th, X.val(bi, s + '_U') || 'MM') * 37.8))}px solid ${Preview.rgb(X.kid(bi, col), '#000')}`;
    }
    /* shading = INTENSITY % of the shading color FILLCOLOR (0 = not filled) */
    const fc = X.kid(bi, 'FILLCOLOR');
    const sh = +X.val(bi, 'INTENSITY') || +X.val(c, 'SHADING') || 0;
    if (sh) d.style.background = `color-mix(in srgb, ${Preview.rgb(fc && X.val(fc, 'USED') === 'X' ? fc : null, '#000')} ${Math.min(100, sh)}%, #fff)`;
  },
  graphic(g) { const d = document.createElement('div'); d.className = 'pv-gr'; d.innerHTML = `${icon('graphic')}<span>${esc(X.val(g, 'GKEYBDS', 'NAME'))}</span>`; return d; },
  address() { const d = document.createElement('div'); d.className = 'pv-gr'; d.innerHTML = `${icon('address')}<span>Address</span>`; return d; },
  node(n, host, form, style) {
    const st = APP.styleFor(form, n) || style;

    if (['TI', 'GR', 'AD'].includes(n.type) && n.outattr && !host.dataset.boxed) {

      if (Preview.box(b, n.outattr)) { b.dataset.boxed = '1'; Preview.node(n, b, form, style); delete b.dataset.boxed; host.appendChild(b); return; }
    }

        else if (t === 'I') lines = [{ f: X.val(n.obj, 'TKEY', 'PAR') || '*', t: `[Include ${X.val(n.obj, 'TKEY', 'OBJECT')} ${X.val(n.obj, 'TKEY', 'NAME')} ${X.val(n.obj, 'TKEY', 'ID')}]` }];

      case 'AD': host.appendChild(Preview.address()); break;

  table(n, form, style) {

    const rowOut = (row, ltName) => {
      const r = document.createElement('div'); r.className = 'pv-row';
      const cells = cellsOf(o, ltName);
      const nodes = row ? row.children.filter(c => c.kind === 'SE-E') : [];
      cells.forEach((c, i) => {
        const d = document.createElement('div'); d.className = 'pv-cell'; d.style.width = toCm(X.val(c, 'CWIDTH') || 0, X.val(c, 'U_CWIDTH') || 'CM', ctx) * pxcm + 'px';
        Preview.cell(d, c);
        const cn = nodes[i]; if (cn) for (const k of cn.children) Preview.node(k, d, form, style);

      for (const ev of n.children.filter(c => c.type === 'EV' && 'HBF'.includes(c.sub))) {

        walk(ev);
      }
    } else {
      /* template: lines from STATLINES, cells addressed by T_LINENR / T_CELLNR of the children */
      const lines = X.kids(X.kid(o, 'STATLINES'), 'item');
      for (const lt of lines) for (let l = +X.val(lt, 'LINEFROM'); l <= +X.val(lt, 'LINETO'); l++) {
        const r = document.createElement('div'); r.className = 'pv-row';
        cellsOf(o, X.val(lt, 'NAME')).forEach((c, ci) => {
          const d = document.createElement('div'); d.className = 'pv-cell'; d.style.width = toCm(X.val(c, 'CWIDTH') || 0, X.val(c, 'U_CWIDTH') || 'CM', ctx) * pxcm + 'px';
          d.style.minHeight = toCm(X.val(lt, 'LHEIGHT') || 0, X.val(lt, 'U_LHEIGHT') || 'CM', ctx) * pxcm + 'px';
          Preview.cell(d, c);
          for (const k of n.children) if (+X.val(k.outattr, 'T_LINENR') === l && +X.val(k.outattr, 'T_CELLNR') === ci + 1) Preview.node(k, d, form, style);
          r.appendChild(d);
        });
        t.appendChild(r);
      }
    }
    return t;
  },
};

'use strict';

const PROC = ['TI', 'GR', 'AD', 'SEC', 'SES', 'SEL', 'CD', 'CO', 'CM', 'SEF'];
const NEW_LABEL = { PA: 'Page', WI: 'Window', GR: 'Graphic', AD: 'Address', TI: 'Text', SEC: 'Table', SER: 'Table Line', SES: 'Template',
  CD: 'Alternative', SEL: 'Loop', CO: 'Program Lines', CM: 'Command', SEF: 'Folder' };
const TAB_TEXT = { TAB_PROPERTIES: 'General Attributes', TAB_OUTPUT_TABLE: 'Table', TAB_OUTPUT_STRUCT: 'Template', TAB_OUTPUT_LOOP: 'Data',
  TAB_OUTPUT_CALCS: 'Calculations', TAB_EVENT: 'Events', TAB_INPUT_FIELDS: 'Web Properties', TAB_OUTOPT: 'Output Options', TAB_CONDITION: 'Conditions',
  TAB_IMPORT: 'Import', TAB_EXPORT: 'Export', TAB_TABLES: 'Tables', TAB_EXCEPTIONS: 'Exceptions', TAB_GLOBAL_DATA: 'Global Data', TAB_GLOBAL_CONS: 'Types',
  TAB_GLOBAL_FIELD: 'Field Symbols', TAB_GLOBAL_INIT: 'Initialization', TAB_GLOBAL_FORM: 'Form Routines', TAB_GLOBAL_CURR: 'Currency/Quant. Fields',
  TAB_BACKGROUND: 'Background Picture', TAB_EDITOR: 'Text', TAB_MGMT: 'Management' };
const GLOBAL_NODES = { H00: 'Global Settings', H01: 'Form Attributes', H02: 'Form Interface', H03: 'Global Definitions', P00: 'Pages and Windows' };
const SFSY = [['PAGE', 'Current page number'], ['FORMPAGES', 'Total number of pages in form'], ['JOBPAGES', 'Total number of pages in print job'],
  ['COPYCOUNT', 'Copy counter (1 = original)'], ['COPYCOUNT0', 'Copy counter (0 = original)'], ['DATE', 'Date'], ['TIME', 'Time'], ['USERNAME', 'User name'],
  ['PAGENAME', 'Page name'], ['WINDOWNAME', 'Window name'], ['XSF', 'XSF output active'], ['XDF', 'XDF output active'], ['SUBRC', 'Return value']];

const FB = {
  form: null, sel: { g: 'H01' }, expanded: new Set(), uiState: new WeakMap(), tabOf: new Map(), tcSel: new Map(), clip: null,
  fpZoom: 0, fpPageEl: null, refreshTimer: 0,

  open(form) {
    this.form = form; this.sel = { g: 'H01' }; this.expanded = new Set(['H00', 'P00']); this.tabOf = new Map(); this.tcSel = new Map(); this.uiState = new WeakMap();

  },
  /* ---------- selection ---------- */
  selNode() { if (!this.sel.el) return null; let n = this.form.node(this.sel.el); if (!n && this.sel.el.isConnected) { this.form.rebuild(); n = this.form.node(this.sel.el); } return n; },
  selKey() { return this.sel.g || this.sel.el; },
  select(s, opts = {}) {
    APP.flushEditors();
    if (s instanceof FNode) s = { el: s.el };
    this.sel = s;
    const n = this.selNode();
    if (n) { for (const a of n.ancestors()) this.expanded.add(a.el); if (n.page) this.fpPageEl = n.page.el; this.expanded.add('P00'); }
    if (s.g && ['H01', 'H02', 'H03'].includes(s.g)) this.expanded.add('H00');
    this.render(opts);
  },
  ui(key) { const k = typeof key === 'string' ? (this['_g' + key] ||= {}) : key; if (typeof key === 'string') return k; let u = this.uiState.get(key); if (!u) { u = {}; this.uiState.set(key, u); } return u; },

  /* ---------- PAI ---------- */
  pai(label, fn) {
    const f = this.form;
    if (APP.mode !== 'edit') { APP.msg('W', 'Switch to change mode first (Ctrl+F1)'); return false; }
    try { f.journal.tx(label, fn); }
    catch (e) { f.endClone?.(); if (e.confirm) { APP.askConfirm(e.confirm, () => this.pai(label, fn)); return false; } APP.msg('E', e.message || String(e)); this.scheduleRender(); return false; }
    f.endClone?.();

  },
  scheduleRender() { clearTimeout(this.refreshTimer); this.refreshTimer = setTimeout(() => this.render(), 0); },
  afterUndo() { this.form.rebuild(); if (this.sel.el && !this.sel.el.isConnected) this.sel = { g: 'P00' }; this.render(); },

  /* ---------- whole builder ---------- */
  render(opts = {}) {
    const f = this.form; if (!f) return;
    f.rebuild();
    if (this.sel.el && !this.form.node(this.sel.el)) this.sel = { g: f.isTextModule ? null : 'P00', el: f.isTextModule ? f.rp?.el : undefined };
    const host = document.getElementById('fb'); if (!host) return;
    const keep = APP.captureFocus(host);
    if (!host.firstChild) host.innerHTML = `<div class="fb-left"><div class="fb-tree pane"></div><div class="fb-fl pane"></div></div><div class="fb-split" data-for="left"></div><div class="fb-center pane"></div><div class="fb-split" data-for="right"></div><div class="fb-right pane"></div>`;
    host.classList.toggle('no-fp', !APP.settings.fp || f.isTextModule);
    host.classList.toggle('no-fl', !APP.settings.fl || f.isTextModule);
    host.classList.toggle('tm', f.isTextModule);
    if (!f.isTextModule) this.renderTree(host.querySelector('.fb-tree'));
    else host.querySelector('.fb-tree').innerHTML = '';
    if (APP.settings.fl && !f.isTextModule) this.renderFieldList(host.querySelector('.fb-fl'));
    this.renderNode(host.querySelector('.fb-center'));
    if (APP.settings.fp && !f.isTextModule) this.renderPainter(host.querySelector('.fb-right'));
    APP.restoreFocus(host, keep);
    APP.updateTitle();
  },

  /* =================================================================
     navigation tree
     ================================================================= */
  label(n) {
    if (n.type === 'EV') {
      const t = n.sub; let l = EV_LABEL[t] || 'Event';
      if (t === 'S' || t === 'E') l += ' ' + X.val(n.obj, 'SFIELD');
      return { name: '', text: l };
    }
    if (n.type === 'RC') return { name: '', text: 'Process Control' };
    return { name: n.name, text: n.caption };
  },
  iconOf(n) {
    if (n.type === 'EV') return n.sub === '+' ? 'ev_true' : n.sub === '-' ? 'ev_false' : 'event';
    if (n.type === 'WI' && n.sub === 'C') return 'win_copy';
    return n.info.icon;
  },
  renderTree(box) {
    const st = box.scrollTop;
    const keys = []; const html = [];
    const selKey = this.selKey();
    const edit = APP.mode === 'edit';
    const row = (key, ic, name, text, hasKids, depth, extra = {}) => {
      const i = keys.length; keys.push(key);
      const open = this.expanded.has(key);
      const cls = 'tree-row' + (selKey === key ? ' sel' : '') + (extra.ref ? ' ref' : '');
      const tip = esc((name ? name + ' ' : '') + (text || '') + (extra.tip ? '  —  ' + extra.tip : ''));
      html.push(`<li role="treeitem"${hasKids ? ` aria-expanded="${open}"` : ''}><div class="${cls}" data-i="${i}" style="padding-left:${4 + depth * 16}px" title="${tip}"${extra.drag ? ' draggable="true"' : ''}><span class="twisty${hasKids ? (open ? ' open' : ' closed') : ''}"></span>${icon(ic)}${extra.cond ? `<span class="cond-mark">${icon('cond_marker')}</span>` : ''}<span class="tree-lab">${name ? `<b>${esc(name)}</b> ` : ''}${esc(text || '')}</span></div>`);
      return open;
    };
    const close = () => html.push('</li>');
    html.push(`<div class="pane-title">${icon('folder_open')} Form ${esc(this.form.name)}</div><ul class="tree" role="tree" tabindex="0">`);
    if (row('H00', 'globals', '', GLOBAL_NODES.H00, true, 0)) {
      html.push('<ul>'); for (const [k, ic] of [['H01', 'header'], ['H02', 'interface'], ['H03', 'globals']]) { row(k, ic, '', GLOBAL_NODES[k], false, 1); close(); } html.push('</ul>');
    }
    close();
    const walk = (n, depth) => {
      const { name, text } = this.label(n);
      const kids = n.children;
      const open = row(n.el, this.iconOf(n), name, text, kids.length > 0, depth, { cond: !!n.cond, ref: n.isRef, tip: n.info.label + (n.isRef ? ' (also used on other pages)' : ''), drag: edit && (this.deletable(n) || n.type === 'WI') });
      if (open && kids.length) { html.push('<ul>'); for (const c of kids) walk(c, depth + 1); html.push('</ul>'); }
      close();
    };
    if (row('P00', 'folder', '', GLOBAL_NODES.P00, !!this.form.rp?.children.length, 0) && this.form.rp) { html.push('<ul>'); for (const c of this.form.rp.children) walk(c, 1); html.push('</ul>'); }
    close();
    html.push('</ul>');
    box.innerHTML = html.join('');
    this.treeKeys = keys;
    const keyOf = el => { const r = el.closest('.tree-row'); return r ? keys[+r.dataset.i] : undefined; };
    const selOf = k => typeof k === 'string' ? { g: k } : { el: k };
    const toggle = k => { if (this.expanded.has(k)) this.expanded.delete(k); else this.expanded.add(k); this.render(); };
    const ul = box.querySelector('.tree');
    ul.onclick = e => { const k = keyOf(e.target); if (k === undefined) return; if (e.target.classList.contains('twisty')) return toggle(k); this.select(selOf(k)); };
    ul.ondblclick = e => { const k = keyOf(e.target); if (k !== undefined && !e.target.classList.contains('twisty')) toggle(k); };
    ul.oncontextmenu = e => { const k = keyOf(e.target); if (k === undefined) return; e.preventDefault(); this.select(selOf(k)); this.treeMenu(e.clientX, e.clientY); };
    ul.addEventListener('keydown', e => this.treeKey(e));
    if (edit) {
      const nodeOf = el => { const k = keyOf(el); return k && typeof k !== 'string' ? this.form.node(k) : (k === 'P00' ? this.form.rp : null); };
      ul.addEventListener('dragstart', e => { const n = nodeOf(e.target); if (!n || n.type === 'RP') return; this.drag = n; e.dataTransfer.effectAllowed = 'copyMove'; e.dataTransfer.setData('text/plain', n.name); });
      ul.addEventListener('dragend', () => { this.drag = null; ul.querySelectorAll('.drop').forEach(r => r.classList.remove('drop')); });
      ul.addEventListener('dragover', e => { const n = nodeOf(e.target); if (!this.drag || !n || n === this.drag) return; e.preventDefault(); e.dataTransfer.dropEffect = e.ctrlKey ? 'copy' : 'move'; ul.querySelectorAll('.drop').forEach(r => r.classList.remove('drop')); e.target.closest('.tree-row').classList.add('drop'); });
      ul.addEventListener('drop', e => { const n = nodeOf(e.target); e.preventDefault(); ul.querySelectorAll('.drop').forEach(r => r.classList.remove('drop')); if (n) this.dropOn(n, e); });
    }
    box.scrollTop = st;
    const selRow = box.querySelector('.tree-row.sel');
    if (selRow) { const r = selRow.getBoundingClientRect(), bb = box.getBoundingClientRect(); if (r.top < bb.top + 30 || r.bottom > bb.bottom) selRow.scrollIntoView({ block: 'nearest' }); }
  },
  visibleKeys() {
    const out = ['H00']; if (this.expanded.has('H00')) out.push('H01', 'H02', 'H03');
    out.push('P00');
    const walk = n => { out.push(n.el); if (this.expanded.has(n.el)) n.children.forEach(walk); };
    if (this.expanded.has('P00') && this.form.rp) this.form.rp.children.forEach(walk);
    return out;
  },
  treeKey(e) {
    const keys = this.visibleKeys(); const i = keys.indexOf(this.selKey());
    const go = k => { e.preventDefault(); this.select(typeof k === 'string' ? { g: k } : { el: k }); setTimeout(() => document.querySelector('.fb-tree .tree')?.focus(), 0); };
    if (e.key === 'ArrowDown' && i < keys.length - 1) go(keys[i + 1]);
    else if (e.key === 'ArrowUp' && i > 0) go(keys[i - 1]);
    else if (e.key === 'ArrowRight') { e.preventDefault(); this.expanded.add(this.selKey()); this.render(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); if (this.expanded.has(this.selKey())) { this.expanded.delete(this.selKey()); this.render(); } else { const n = this.selNode(); if (n?.parent) go(n.parent.type === 'RP' ? 'P00' : n.parent.el); } }

    else if (e.key === 'c' && e.ctrlKey) { e.preventDefault(); this.fcode('OB_COPY'); }

  expandAll(on, from) {

    if (!start) { if (on) { this.expanded.add('H00'); this.expanded.add('P00'); } this.form.rp?.children.forEach(walk); if (!on) { this.expanded.delete('H00'); } }
    else walk(start);

  },

  /* ---------- placement rules (LSTXBF16 / LSTXBO02) ---------- */
  inTableArea(p) {
    for (let n = p; n && n.type !== 'WI'; n = n.parent) {
      if (n.kind === 'SE-R' || n.kind === 'SE-E') return false;
      if (n.type === 'EV' && n.parent?.kind === 'SE-C' && 'HBF'.includes(n.sub)) return true;
    }
    return false;
  },
  allowedChildren(p) {
    if (!p) return new Set();
    if (p.type === 'RP') return new Set(['PA']);
    if (p.type === 'PA') return new Set(['WI', 'GR', 'AD']);
    if (p.type === 'WI') return ['G', 'A'].includes(p.sub) ? new Set() : new Set(PROC);
    if (p.type === 'CD' || p.kind === 'SE-C' || p.kind === 'SE-R') return new Set();

    let s = new Set(PROC);
    let otab = false; for (let n = p; n && n.type !== 'WI'; n = n.parent) if (n.type === 'SE' && X.val(n.obj, 'OTABTYPE')) { otab = true; break; }
    if (otab) { s.delete('SEC'); s.delete('SES'); }
    if (p.type === 'EV' && p.parent?.kind === 'SE-C' && 'HBF'.includes(p.sub)) s = new Set(['SER', 'SEL', 'SEF', 'CM']);

  },
  /* where would "Create <kind>" on node n put the new node? */
  placement(kind, n) {
    if (!n) return null;
    if (n.type === 'RP') return kind === 'PA' ? { parent: n, where: 'child' } : null;
    if (this.allowedChildren(n).has(kind)) return { parent: n, where: 'child' };
    if (n.parent && this.allowedChildren(n.parent).has(kind) && !(n.type === 'EV' && n.parent.type !== 'SE') && !(n.type === 'EV' && 'HBF+-'.includes(n.sub)) && n.kind !== 'SE-E') return { parent: n.parent, ref: n, where: 'after' };
    return null;
  },
  targetNode() { if (this.sel.g === 'P00') return this.form.rp; return this.selNode(); },

  /* ---------- node operations ---------- */
  createNode(kind, n = this.targetNode(), place = null) {
    const f = this.form; const pl = place || this.placement(kind, n);
    if (!pl) return APP.msg('E', `${NEW_LABEL[kind]} cannot be created here`);
    let created = null;
    const ok = this.pai(`Create ${NEW_LABEL[kind]}`, () => {
      const k = pl.parent.type === 'PA' && kind === 'GR' ? 'GRW' : pl.parent.type === 'PA' && kind === 'AD' ? 'ADW' : kind;
      const el = f.createNode(k, pl.parent);
      if (k === 'WI' && !f.all.some(x => x.type === 'WI' && X.val(x.obj, 'WTYPE') === 'M')) { /* first window of a form becomes main window */
        const obj = X.path(el, 'sf:OBJ').firstElementChild; X.set(obj, 'WTYPE', 'M'); X.setPath(obj, ['NAME', 'INAME'], 'MAIN'); f.setCaption(obj, 'Main Window');
        for (const it of X.kids(X.kid(obj, 'T_CAPTION'), 'item')) X.set(it, 'INAME', 'MAIN');
      }

      created = el;
      if (kind === 'SER') {
        f.rebuild(); const row = f.node(el); const t = row.ancestors().find(a => a.kind === 'SE-C');
        if (t) { const lt = X.kids(X.kid(t.obj, 'DYNLINES'), 'item').find(i => X.val(i, 'DEFAULTVAL') === 'X') || X.kids(X.kid(t.obj, 'DYNLINES'), 'item')[0]; if (lt) { X.set(row.ensureOutattr(), 'T_LINETYPE', X.val(lt, 'NAME')); syncRowCells(f, row, t, X.val(lt, 'NAME')); } }
      }
    });
    if (ok && created) { this.expanded.add(pl.parent.type === 'RP' ? 'P00' : pl.parent.el); this.sel = { el: created }; this.tabOf.set(created, null); this.scheduleRender(); APP.msg('S', `${NEW_LABEL[kind]} created`); }
  },
  deletable(n) { return n && n.type !== 'RP' && !(n.type === 'EV' && 'HBF+-'.includes(n.sub)) && n.kind !== 'SE-E'; },
  deleteNode(n = this.selNode()) {
    if (!this.deletable(n)) return APP.msg('E', n ? `Node ${this.label(n).text} cannot be deleted` : 'Select a node');
    const next = n.parent && n.parent.type !== 'RP' ? n.parent.el : null;
    const sibs = n.parent ? n.parent.children : []; const i = sibs.indexOf(n);
    const nextSel = sibs[i + 1] || sibs[i - 1];
    if (this.pai(`Delete ${n.name}`, () => {
      if (n.type === 'SE' && n.parent?.kind === 'SE-C' && n.type === 'EV') return;

    })) { this.sel = nextSel ? { el: nextSel.el } : next ? { el: next } : { g: 'P00' }; APP.msg('S', `Node ${n.name} deleted`); }
  },
  copyNode(n = this.selNode(), cut = false) {
    if (!n || n.type === 'RP') return APP.msg('W', 'Select a node');
    if (!this.deletable(n) && cut) return APP.msg('E', 'This node cannot be cut');

  kindCode(c) { return { PA: 'PA', WI: 'WI', TI: 'TI', GR: 'GR', AD: 'AD', CO: 'CO', CM: 'CM', CD: 'CD' }[c.type] || ({ 'SE-C': 'SEC', 'SE-S': 'SES', 'SE-L': 'SEL', 'SE-F': 'SEF', 'SE-R': 'SER' }[c.kind]) || 'SEF'; },
  pasteNode(n = this.targetNode()) {

  moveNode(n, target, where, copy) {

  /* Edit > Node > Create (F5): dialog 2001 */

  tablePainter(n, env) {

        { const bi = X.kids(X.kid(c, 'BORDERS'), 'item')[0], fc = X.kid(bi, 'FILLCOLOR'); const sh = +X.val(bi, 'INTENSITY') || +X.val(c, 'SHADING') || 0;

  /* =================================================================

  renderPainter(box) {
    const f = this.form;
    const st = { t: box.scrollTop, l: box.scrollLeft };
    box.innerHTML = '';
    const pages = f.pages; if (!pages.length) { box.innerHTML = '<div class="empty">No pages</div>'; return; }
    let page = pages.find(p => p.el === this.fpPageEl) || pages[0];

    this.fpPageEl = page.el;
    const bar = document.createElement('div'); bar.className = 'fp-bar';
    const psel = document.createElement('select'); psel.className = 'fp-page';
    for (const p of pages) { const o = document.createElement('option'); o.value = p.name; o.textContent = `${p.name}  ${p.caption}`; if (p === page) o.selected = true; psel.appendChild(o); }
    psel.onchange = () => { const p = pages.find(x => x.name === psel.value); this.fpPageEl = p.el; this.select({ el: p.el }); };
    const bt = (ic, tip, fn) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'tb-btn small'; b.innerHTML = icon(ic); b.title = tip; b.onclick = fn; bar.appendChild(b); };
    bar.insertAdjacentHTML('beforeend', `<span class="fp-title">Form Painter</span>`);
    bar.appendChild(psel);
    bt('expand', 'Zoom in', () => { this.fpZoom = (this.fpZoom || this.fitZoom) * 1.2; this.render(); });
    bt('collapse', 'Zoom out', () => { this.fpZoom = (this.fpZoom || this.fitZoom) / 1.2; this.render(); });
    bt('display', 'Automatic Zoom', () => { this.fpZoom = 0; this.render(); });
    bt('cancel', 'Form Painter off (F9)', () => { APP.settings.fp = false; APP.saveSettings(); this.render(); });
    box.appendChild(bar);
    const { w, h, format } = f.pageSize(page);
    const avail = Math.max(240, (box.clientWidth || 420) - 36);
    this.fitZoom = avail / (w * 37.8);
    const z = this.fpZoom || this.fitZoom; const pxcm = 37.8 * z;
    const scroll = document.createElement('div'); scroll.className = 'fp-scroll';
    const sheet = document.createElement('div'); sheet.className = 'fp-sheet'; sheet.style.width = (w * pxcm) + 'px'; sheet.style.height = (h * pxcm) + 'px';
    sheet.title = `${page.name} · ${format} ${X.val(page.obj, 'PAGEORTN') === 'L' ? 'Landscape' : 'Portrait'}`;
    /* background picture */
    const bg = X.path(page.obj, 'sf:BACKGROUND', 'sf:GRAPHIC');
    if (bg && X.val(bg, 'GKEYBDS', 'NAME')) { const d = document.createElement('div'); d.className = 'fp-bg'; d.innerHTML = `${icon('graphic')} Background picture ${esc(X.val(bg, 'GKEYBDS', 'NAME'))}`; sheet.appendChild(d); }
    const ctx = f.ctx; const edit = APP.mode === 'edit';
    const wins = page.children.filter(c => c.type === 'WI');
    const selWin = n ? (n.type === 'WI' ? n : n.window) : null;
    for (const win of wins) {
      const oa = win.outattr; if (!oa) continue;
      const g = k => toCm(X.val(oa, k) || 0, X.val(oa, 'U_' + k) || 'CM', ctx);
      const L = g('WLEFT'), T = g('WTOP'), W = g('WWIDTH'), H = g('WHEIGHT');
      const d = document.createElement('div'); d.className = 'fp-win wt-' + (win.sub || 'T');
      if (selWin && selWin.el === win.el) d.classList.add('sel');
      d.style.left = (L * pxcm) + 'px'; d.style.top = (T * pxcm) + 'px'; d.style.width = Math.max(6, W * pxcm) + 'px'; d.style.height = Math.max(6, H * pxcm) + 'px';
      const lab = document.createElement('span'); lab.className = 'fp-lab'; lab.textContent = win.name; d.appendChild(lab);
      if (win.sub === 'G') { const gi = document.createElement('div'); gi.className = 'fp-gr'; gi.innerHTML = icon('graphic') + `<span>${esc(X.val(win.innerObj, 'GKEYBDS', 'NAME') || '')}</span>`; d.appendChild(gi); }
      if (win.sub === 'A') { const gi = document.createElement('div'); gi.className = 'fp-gr'; gi.innerHTML = icon('address'); d.appendChild(gi); }
      d.title = `${win.name} ${win.caption}\n${X.val(oa, 'WLEFT')} ${X.val(oa, 'U_WLEFT')} / ${X.val(oa, 'WTOP')} ${X.val(oa, 'U_WTOP')} · ${X.val(oa, 'WWIDTH')} ${X.val(oa, 'U_WWIDTH')} × ${X.val(oa, 'WHEIGHT')} ${X.val(oa, 'U_WHEIGHT')}`;
      if (L + W > w + 0.001 || T + H > h + 0.001 || L < 0 || T < 0) d.classList.add('outside');
      d.addEventListener('mousedown', e => {
        if (e.button !== 0) return;
        e.stopPropagation();
        if (!(selWin && selWin.el === win.el)) { this.select({ el: win.el }); return; }
        if (!edit) return;
        const mode = e.target.classList.contains('fp-h') ? e.target.dataset.h : 'move';
        const x0 = e.clientX, y0 = e.clientY; const r0 = { L, T, W, H };
        let r = { ...r0 };
        const snap = v => Math.round(v * 20) / 20;
        const mv = ev => {
          const dx = (ev.clientX - x0) / pxcm, dy = (ev.clientY - y0) / pxcm;
          r = { ...r0 };
          if (mode === 'move') { r.L = snap(r0.L + dx); r.T = snap(r0.T + dy); }
          if (mode.includes('e')) r.W = Math.max(.1, snap(r0.W + dx));
          if (mode.includes('s')) r.H = Math.max(.1, snap(r0.H + dy));
          if (mode.includes('w')) { r.L = snap(r0.L + dx); r.W = Math.max(.1, snap(r0.W - dx)); }
          if (mode.includes('n')) { r.T = snap(r0.T + dy); r.H = Math.max(.1, snap(r0.H - dy)); }
          d.style.left = r.L * pxcm + 'px'; d.style.top = r.T * pxcm + 'px'; d.style.width = r.W * pxcm + 'px'; d.style.height = r.H * pxcm + 'px';
          APP.msg('I', `${win.name}: left ${r.L.toFixed(2)} cm, top ${r.T.toFixed(2)} cm, width ${r.W.toFixed(2)} cm, height ${r.H.toFixed(2)} cm`, true);
        };
        const up = () => {
          document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up);
          if (r.L === r0.L && r.T === r0.T && r.W === r0.W && r.H === r0.H) return;
          this.pai(mode === 'move' ? 'Move window' : 'Resize window', () => {
            const o = win.ensureOutattr();
            const put = (k, cm) => { const u = X.val(o, 'U_' + k) || 'CM'; X.set(o, 'U_' + k, u); X.set(o, k, fromCm(cm, u, ctx).toFixed(2)); };
            if (r.L !== r0.L) put('WLEFT', r.L); if (r.T !== r0.T) put('WTOP', r.T); if (r.W !== r0.W) put('WWIDTH', r.W); if (r.H !== r0.H) put('WHEIGHT', r.H);
          });
        };
        document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
      });
      d.addEventListener('contextmenu', e => { e.preventDefault(); e.stopPropagation(); this.select({ el: win.el }); this.fpMenu(e.clientX, e.clientY, page, win); });
      if (edit && selWin && selWin.el === win.el) for (const hh of ['n', 's', 'e', 'w', 'ne', 'nw', 'se', 'sw']) { const k = document.createElement('span'); k.className = 'fp-h fp-h-' + hh; k.dataset.h = hh; d.appendChild(k); }
      sheet.appendChild(d);
    }
    sheet.addEventListener('contextmenu', e => { e.preventDefault(); this.fpMenu(e.clientX, e.clientY, page, null); });
    sheet.addEventListener('mousedown', e => { if (e.target === sheet) this.select({ el: page.el }); });
    scroll.appendChild(sheet); box.appendChild(scroll);
    const leg = document.createElement('div'); leg.className = 'fp-legend'; leg.textContent = `${format} ${w.toFixed(1)} × ${h.toFixed(1)} cm · zoom ${Math.round(z * 100)}%`;
    box.appendChild(leg);
    box.scrollTop = st.t; box.scrollLeft = st.l;
  },
  fpMenu(x, y, page, win) {
    const edit = APP.mode === 'edit';
    const items = [];
    if (edit) {
      items.push({ label: 'Create', icon: 'create', sub: [{ label: 'Window', icon: 'win', fn: () => this.createNode('WI', page) }, { label: 'Graphic', icon: 'graphic', fn: () => this.createNode('GR', page) }, { label: 'Address', icon: 'address', fn: () => this.createNode('AD', page) }] });
      if (win) { items.push({ label: 'Cut', icon: 'cut', fn: () => this.copyNode(win, true) }, { label: 'Copy', icon: 'copy', fn: () => this.copyNode(win) }); }
      items.push({ label: 'Paste', icon: 'paste', disabled: !this.clip, fn: () => this.pasteNode(page) });
      if (win) items.push({ label: 'Delete', icon: 'delete', fn: () => this.deleteNode(win) });
      items.push('-');
    }
    items.push({ label: 'Settings…', icon: 'tools', fn: () => APP.dialogSettings('SET_FP') });
    APP.contextMenu(x, y, items);
  },
};

  fcode(fc) {
    const s = this.style, k = this.sel.k;
    const isPar = fc === 'CREATE_PAR' || (fc !== 'CREATE_STR' && (k === 'PAR' || k === 'PARS'));
    const codeOk = (v, list) => { v = v.trim().toUpperCase(); if (!/^[A-Z0-9][A-Z0-9_]?$/.test(v)) throw new Error('Enter a name of one or two characters (A-Z, 0-9)'); if (list.some(i => X.val(i, isPar ? 'TDPARGRAPH' : 'TDSTRING') === v)) throw new Error(`${isPar ? 'Paragraph format' : 'Character format'} ${v} already exists`); return v; };
    if (fc === 'CREATE_PAR' || fc === 'CREATE_STR') {
      APP.promptScreen(isPar ? 'Create Paragraph Format' : 'Create Character Format', 'SAPLSTXBS:0120', { 'SSFSCREENS-SNODE_TEXT': isPar ? 'Paragraph Format' : 'Character Format' }, 'POPUP_NODE_NAME', v => {
        let code; if (!this.pai('Create', () => { code = codeOk(v, isPar ? s.paragraphs() : s.strings()); this.createItem(isPar, code); })) return;
        this.expanded.add(isPar ? 'PARS' : 'STRS'); this.sel = { k: isPar ? 'PAR' : 'STR', code }; this.render();
      });
    } else if (fc === 'COPY' || fc === 'RENAME') {
      const it = this.item(); if (!it || (k !== 'PAR' && k !== 'STR')) return APP.msg('W', 'Select a paragraph or character format');
      const old = this.sel.code;
      APP.promptScreen(fc === 'COPY' ? 'Copy Node' : 'Rename Node', 'SAPLSTXBS:0130', { 'SSFSCREENS-SOLD_TEXT': 'Old name', POPUP_OLD_NAME: old, 'SSFSCREENS-SNEW_TEXT': 'New name' }, 'POPUP_NEW_NAME', v => {
        let code;
        if (!this.pai(fc === 'COPY' ? 'Copy' : 'Rename', () => {
          code = codeOk(v, isPar ? s.paragraphs() : s.strings());
          const field = isPar ? 'TDPARGRAPH' : 'TDSTRING';
          let target = it;
          if (fc === 'COPY') { target = it.cloneNode(true); }
          else it.remove();
          X.set(target, field, code);
          this.insertSorted(isPar ? 'PARAGRAPHS' : 'STRINGS', target, field);
          if (isPar) for (const t of s.list('TABSTOPS').filter(t => X.val(t, 'TDPARGRAPH') === old)) {
            if (fc === 'COPY') { const c = t.cloneNode(true); X.set(c, 'TDPARGRAPH', code); t.parentNode.insertBefore(c, null); } else X.set(t, 'TDPARGRAPH', code);
          }
          if (fc === 'RENAME' && isPar) { if (X.val(s.header, 'TDFIRSTPAR') === old) X.set(s.header, 'TDFIRSTPAR', code); for (const p of s.paragraphs()) if (X.val(p, 'TDLFIRSTPA') === old) X.set(p, 'TDLFIRSTPA', code); }
          if (fc === 'RENAME' && !isPar) for (const p of s.paragraphs()) if (X.val(p, 'TDLSTRING') === old) X.set(p, 'TDLSTRING', code);
          if (isPar) this.sortTabstops();
        })) return;
        this.sel = { k, code }; this.render();
      });
    } else if (fc === 'DELETE') {
      const it = this.item(); if (!it || (k !== 'PAR' && k !== 'STR')) return APP.msg('W', 'Select a paragraph or character format');
      const code = this.sel.code;
      if (isPar && X.val(s.header, 'TDFIRSTPAR') === code) return APP.msg('E', `${code} is the standard paragraph and cannot be deleted`);
      APP.confirmDialog('Delete Node', `Delete ${isPar ? 'paragraph format' : 'character format'} ${code}?`, () => {
        if (this.pai('Delete', () => { it.remove(); if (isPar) for (const t of s.list('TABSTOPS').filter(t => X.val(t, 'TDPARGRAPH') === code)) t.remove(); for (const w of ['PARAGRAPHS', 'STRINGS', 'TABSTOPS']) { const l = X.kid(s.root, 'sf:' + w); if (l && !l.children.length) l.remove(); } })) { this.sel = { k: isPar ? 'PARS' : 'STRS' }; this.render(); }
      });
    }
  },
  insertSorted(list, it, field) {
    const l = this.style.ensureList(list);

const APP = {
  mode: 'show', screen: 'initial', doc: null, docType: null, dirty: false, inactive: false,
  lib: new Map(), styleCache: new Map(), commits: [], confirmed: new Set(), tcClip: null, lastText: null,

  init: { type: 'SF', SF: '', SS: '', TM: '', filter: '', libType: 'ALL' },

  /* =============== boot =============== */
  async start() {

  saveSettings() { try { localStorage.setItem('zsf.settings', JSON.stringify(this.settings)); } catch {} },
  saveInit() { try { localStorage.setItem('zsf.init', JSON.stringify({ ...this.init, filter: '' })); } catch {} },

  /* =============== object library (IndexedDB, per browser) =============== */
  key(type, name) { return type + ':' + String(name).toUpperCase(); },
  libGet(type, name) { return this.lib.get(this.key(type, name)) || null; },
  classify(text) {
    const head = text.slice(0, 4000);
    if (/<sf:SMARTSTYLE\b/.test(head)) return { type: 'SS', name: (/<STYLENAME>([^<]*)</.exec(text) || [])[1] || '', caption: (/<CAPTION>([^<]*)</.exec(text) || [])[1] || '' };

      const tm = /<FORMTYPE>T<\/FORMTYPE>/.test(head);
      return { type: tm ? 'TM' : 'SF', name: (/<FORMNAME>([^<]*)</.exec(text) || [])[1] || '', caption: (/<CAPTION>([^<]*)</.exec(text) || [])[1] || '' };
    }
    return null;
  },
  libPut(text, extra = {}) {
    const c = this.classify(text); if (!c || !c.name) throw new Error('File is neither a Smart Form nor a Smart Style XML');
    const k = this.key(c.type, c.name);
    const prev = this.lib.get(k);
    const e = { type: c.type, name: c.name, caption: decodeXml(c.caption), text, active: extra.active ?? text, modified: extra.modified ?? false, changed: extra.changed || Date.now(), source: extra.source || prev?.source || '' };
    this.lib.set(k, e); this.styleCache.delete(c.name.toUpperCase());

  },
  libDelete(type, name) { const k = this.key(type, name); this.lib.delete(k); this.dbDel(k); },
  idb() {
    if (this._idb) return this._idb;
    this._idb = new Promise(res => {
      try {
        const r = indexedDB.open('zsmartforms', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('lib');
        r.onsuccess = () => res(r.result); r.onerror = () => res(null); r.onblocked = () => res(null);
      } catch { res(null); }
    });
    return this._idb;
  },
  async libLoad() {
    const db = await this.idb(); if (!db) return;
    await new Promise(res => {
      try {
        const tx = db.transaction('lib', 'readonly'); const st = tx.objectStore('lib'); const r = st.openCursor();
        r.onsuccess = () => { const c = r.result; if (c) { this.lib.set(c.key, c.value); c.continue(); } else res(); };
        r.onerror = () => res();

  },
  async dbPut(e) { const db = await this.idb(); if (!db) return; try { db.transaction('lib', 'readwrite').objectStore('lib').put(e, this.key(e.type, e.name)); } catch {} },
  async dbDel(k) { const db = await this.idb(); if (!db) return; try { db.transaction('lib', 'readwrite').objectStore('lib').delete(k); } catch {} },
  async dbClear() { const db = await this.idb(); if (!db) return; try { db.transaction('lib', 'readwrite').objectStore('lib').clear(); } catch {} },
  loadSamples() {
    for (const t of (window.SAMPLES || [])) { try { this.libPut(t, { source: 'example' }); } catch (e) { console.warn(e); } }
  },
  allStyles() { const out = []; for (const e of this.lib.values()) if (e.type === 'SS') { const s = this.styleByName(e.name); if (s) out.push(s); } if (this.doc instanceof SfStyle && !out.includes(this.doc)) out.push(this.doc); return out; },
  styleByName(name) {

  styleFor(form, node) { return this.styleByName(node ? form.currentStyle(node) : X.val(form.varItem, 'STDSTYLE')); },

  captureFocus(host) {

  pathOf(el, host) { const p = []; for (let e = el; e && e !== host; e = e.parentElement) p.unshift([...e.parentElement.children].indexOf(e)); return p.join('.'); },

  updateTitle() { const t = document.getElementById('title'); if (t) t.textContent = this.title() + (this.dirty ? ' *' : ''); document.title = this.doc ? `${this.doc.name} – ZSMARTFORMS` : 'ZSMARTFORMS'; },
  renderChrome() {

      const b = document.createElement('button'); b.type = 'button'; b.className = 'tb-btn' + (t.label ? ' lbl' : '') + (t.on ? ' on' : ''); b.title = t.tip; b.innerHTML = icon(t.ic) + (t.label ? `<span>${esc(t.label)}</span>` : '');

  },
  /* Change / Display get their own color scheme; the frame fades between them and the

  applyMode() {

  /* =============== function codes =============== */
  fcode(fc) {
    const s = this.screen, edit = this.mode === 'edit', b = this.builder();
    try {
      switch (fc) {
        case 'ENTER': return this.screen === 'initial' ? null : b?.render();
        case 'BACK': case 'EXIT': case 'CANC': case 'OTHER': return this.leave(fc);
        case 'SAVE': return this.save();
        case 'SWIT': return this.toggleMode();
        case 'CHECKALL': return this.checkAll();
        case 'ACTIVATE': return this.activate(true);
        case 'ACTIVATE_NC': return this.activate(false);
        case 'TEST': return this.test();
        case 'PREVIEW': return this.flushEditors(), this.go('preview');
        case 'UNDO': case 'REDO': {
          if (!edit || !this.doc) return;

        case 'HLS_OPEN': this.settings.fl = !this.settings.fl; this.saveSettings(); FB.render(); return this.renderChrome();
        case 'NODECREATE': case 'NODEDELETE': case 'OB_CUT': case 'OB_COPY': case 'OB_PASTE': case 'TREXPAND': case 'TRCOLLAPSE':

        case 'CREATE_PAR': case 'CREATE_STR': case 'COPY': case 'RENAME': case 'DELETE':
          if (s === 'style') return SB.fcode(fc); if (s === 'initial') return this.initFcode(fc); return;
        case 'GOTO_H01': case 'GOTO_H02': case 'GOTO_H03': return FB.select({ g: fc.slice(5) });
        case 'GOTO_HDR': return SB.select({ k: 'HDR' });
        case 'GOTO_STYLE': { const n = FB.selNode(); const st = this.doc.currentStyle ? (n ? this.doc.currentStyle(n) : X.val(this.doc.varItem, 'STDSTYLE')) : ''; if (!this.libGet('SS', st)) return this.msg('E', `Style ${st} is not in the library`); return this.leave('STYLE:' + st); }
        case 'SETTINGS': return this.dialogSettings();
        case 'INFO': return this.dialogInfo();
        case 'FMNAME': return this.dialogFm();
        case 'FIND': return this.dialogFind();
        case 'UPLOAD': return this.upload();
        case 'UPLOAD_INTO': return this.uploadInto();
        case 'DOWNLOAD': return this.download();
        case 'DOWNLOAD_SUB': return this.downloadSubtree();
        case 'DOWNLOAD_CHANGED': return this.downloadChanged();
        case 'REVERT': return this.revert();
        case 'LIBCLEAR': return this.confirmDialog('Clear Library', 'Remove all objects from the library in this browser? Changed objects that were not downloaded are lost.', () => { this.lib.clear(); this.dbClear(); this.styleCache.clear(); this.go('initial'); this.msg('S', 'Library cleared'); });
        case 'ABOUT': return this.dialogAbout();

  toggleMode() {

  reloadFromLib() {

  },
  leave(fc) {
    this.flushEditors();
    const go = () => {
      if (this.doc?.journal) this.doc.journal.dispose();

    };

    if (this.dirty) return this.choiceDialog(fc === 'CANC' ? 'Cancel Form Builder' : 'End Form Builder', `Do you want to save ${this.doc.name}?`, [['Yes', () => { if (this.save()) go(); }], ['No', go]]);
    go();

  /* =============== save / activate =============== */
  save(noBackend) {
    if (!this.doc || this.mode !== 'edit') return false;
    this.flushEditors();
    const text = this.doc.serialize();
    const prev = this.libGet(this.docType, this.doc.name);
    this.libPut(text, { active: prev?.active ?? text, modified: true, changed: Date.now() });
    this.dirty = false; this.renderChrome();
    const what = TYPE_LABEL[this.docType];

  },
  checkAll() {
    this.flushEditors();
    if (this.doc instanceof SfStyle) { const r = this.checkStyle(this.doc); this.showCheck(r, `Check Style ${this.doc.name}`); return r; }
    const r = Check.run(this.doc); this.showCheck(r, `Check Form ${this.doc.name}`); return r;
  },
  checkStyle(s) {
    const out = [];
    if (!X.val(s.header, 'TDFIRSTPAR')) out.push({ type: 'E', text: 'No standard paragraph defined' });
    else if (!s.para(X.val(s.header, 'TDFIRSTPAR'))) out.push({ type: 'E', text: `Standard paragraph ${X.val(s.header, 'TDFIRSTPAR')} does not exist` });
    if (!X.val(s.header, 'TDFAMILY')) out.push({ type: 'E', text: 'Header data: no font family' });
    for (const p of s.paragraphs()) {
      const c = X.val(p, 'TDPARGRAPH');
      const lf = X.val(p, 'TDLFIRSTPA'); if (lf && !s.para(lf)) out.push({ type: 'E', text: `Paragraph ${c}: outline paragraph ${lf} does not exist` });
      const ls = X.val(p, 'TDLSTRING'); if (ls && !s.str(ls)) out.push({ type: 'E', text: `Paragraph ${c}: character format ${ls} does not exist` });
      const tabs = s.tabstops(c).map(t => toCm(X.val(t, 'TDTABPOS'), X.val(t, 'TDTABPOSU') || 'CM'));
      for (let i = 1; i < tabs.length; i++) if (tabs[i] <= tabs[i - 1]) out.push({ type: 'W', text: `Paragraph ${c}: tab ${i + 1} is not to the right of tab ${i}` });
      if (!X.val(p, 'CAPTION')) out.push({ type: 'W', text: `Paragraph ${c}: no description` });
    }

  },
  showCheck(list, title) {
    const errs = list.filter(x => x.type === 'E').length, warns = list.length - errs;
    if (!list.length) { this.msg('S', `${this.doc.name}: no errors found`); return; }
    this.msg(errs ? 'E' : 'W', `${this.doc.name}: ${errs} error(s), ${warns} warning(s)`);
    const body = document.createElement('div'); body.className = 'errlist';
    const t = document.createElement('table'); t.innerHTML = '<thead><tr><th></th><th>Node</th><th>Message</th></tr></thead>';
    const tb = t.createTBody();
    for (const m of list.sort((a, b) => (a.type === 'E' ? 0 : 1) - (b.type === 'E' ? 0 : 1))) {
      const r = tb.insertRow(); const n = m.el && this.doc.node ? this.doc.node(m.el) : null;
      r.insertCell().innerHTML = icon(m.type === 'E' ? 'error' : 'warning');
      r.insertCell().textContent = n ? n.name : (m.nodeName || '');
      r.insertCell().textContent = m.text;
      if (n) { r.classList.add('link'); r.onclick = () => { this.closeModal(); FB.select({ el: n.el }); }; }
    }
    body.appendChild(t);
    this.modal({ title, body, wide: true, buttons: [['Close', null, true]] });
  },
  activate(withCheck) {
    if (!this.doc) return;

    if (withCheck) {
      const r = this.doc instanceof SfStyle ? this.checkStyle(this.doc) : Check.run(this.doc);
      if (r.some(x => x.type === 'E')) { this.showCheck(r, 'Activation not possible'); return; }
    }
    if (this.mode === 'edit' && this.dirty) this.save(true);
    const e = this.libGet(this.docType, this.doc.name);
    if (e) { e.active = e.text; this.dbPut(e); }
    this.inactive = false; this.renderChrome(); this.rerender();
    this.msg('S', `${TYPE_LABEL[this.docType]} ${this.doc.name} activated`);
    if (this.settings.backend && e) this.backendSave(this.docType, this.doc.name, e.text, true);
  },
  test() {
    if (!this.doc || this.doc instanceof SfStyle) return;
    if (this.dirty) return this.choiceDialog('Test Form', 'Form must be saved before test. Do you want to save?', [['Yes', () => { this.save(); this.test(); }], ['No', () => {}]]);
    if (this.settings.backend) return this.backendTest(this.doc.name);

  revert() {
    const e = this.libGet(this.docType, this.doc.name); if (!e) return;
