    if (!/^[A-Z%][A-Z0-9_%]*$/.test(name)) return 'Name may only contain A-Z, 0-9, _ and %';
    const clash = this.allNamed(obj.localName).some(o => o !== obj && X.val(o, 'NAME', 'INAME') === name);
    return clash ? `Node name ${name} already exists` : '';
  }
  rename(obj, newName) {
    const old = X.val(obj, 'NAME', 'INAME');
    if (old === newName) return;
    X.setPath(obj, ['NAME', 'INAME'], newName);
    for (const holder of ['T_CAPTION', 'T_TEXT']) for (const it of X.kids(X.kid(obj, holder), 'item')) if (X.val(it, 'INAME') === old) X.set(it, 'INAME', newName);
    if (obj.localName === 'PAGE') {
      for (const el of this.doc.getElementsByTagNameNS(NS_IFR, 'INAME')) {
        const p = el.parentElement?.localName;
        if ((p === 'NEXTPAGE' || p === 'PAGENAME') && el.textContent === old) el.textContent = newName;
      }
    }
  }

  /* ---------- node creation ---------- */
  outattrEl(extra = {}) {
    const doc = this.doc, { name } = this.nextAutoName('%OUTATTRIB', 'OUTATTR');
    const wrap = X.mk(doc, 'sf:OUTATTR'), oa = X.mk(doc, 'sf:OUTATTR'); wrap.appendChild(oa);
    X.setPath(oa, ['NAME', 'INAME'], name);
    for (const [k, v] of Object.entries(extra)) X.set(oa, k, v);
    for (const [k, v] of Object.entries({ U_WFRAME: 'PT', U_WBOXV: 'CM', U_WBOXH: 'CM', U_WLEFT: 'CM', U_WWIDTH: 'CM', U_WTOP: 'CM', U_WHEIGHT: 'CM' })) if (!X.kid(oa, k)) X.set(oa, k, v);
    const b = X.ensure(oa, 'BORDER');
    for (const side of ['LEFTATTR', 'TOPATTR', 'RIGHTATTR', 'BOTTOMATTR']) {
      const s = X.ensure(b, side);
      X.set(s, 'THICKNESS', '0.00'); X.set(s, 'THICKNESSU', 'PT'); X.set(s, 'DISTANCE', '0.00'); X.set(s, 'DISTANCEU', 'CM');
      const c = X.ensure(s, 'COLOR'); for (const k of ['RED', 'GREEN', 'BLUE', 'TRANS']) X.set(c, k, '000');
    }
    const tc = X.ensure(oa, 'T_CAPTION'); X.newItem(tc, { LANGU: this.lang, FORMNAME: this.name, OBJTYPE: 'OA', INAME: name });
    return wrap;
  }
  baseObj(tag, prefix, capt, objtype, fields) {
    const doc = this.doc, obj = X.mk(doc, 'sf:' + tag);
    const { name, n } = this.nextAutoName(prefix, tag);
    X.setPath(obj, ['NAME', 'INAME'], name);
    X.set(obj, 'CAPTION', `${capt} ${n}`);
    for (const [k, v] of Object.entries(fields || {})) {
      if (v && typeof v === 'object') { const e = X.ensure(obj, k); for (const [k2, v2] of Object.entries(v)) X.set(e, k2, v2); }
      else X.set(obj, k, v);
    }
    const tc = X.ensure(obj, 'T_CAPTION'); X.newItem(tc, { LANGU: this.lang, FORMNAME: this.name, OBJTYPE: objtype, INAME: name, CAPTION: `${capt} ${n}` });
    return obj;
  }
  nodeEl(type, obj, { outattr = null, succ = true } = {}) {
    const doc = this.doc, node = X.mk(doc, 'sf:NODE');
    X.set(node, 'NODETYPE', type);
    const holder = X.mk(doc, 'sf:OBJ'); holder.appendChild(obj); node.appendChild(holder);
    if (outattr) node.appendChild(outattr);
    if (succ) node.appendChild(X.mk(doc, 'sf:SUCC'));
    return node;
  }
  nextId() {
    let max = 0; for (const k of this.ids.keys()) { const n = parseInt(k, 10); if (n > max) max = n; }
    return String(max + 1) + ' ';
  }
  currentStyle(parentNode) {
    for (let n = parentNode; n; n = n.parent) {
      const s = X.val(n.outattr, 'STDSTYLE'); if (s) return s;
      if (n.type === 'TI') { const s2 = X.val(n.obj, 'STYLE_NAME'); if (s2) return s2; }
    }
    return X.val(this.varItem, 'STDSTYLE');
  }
  textsAreTranslatable() {
    let yes = 0, no = 0;
    for (const t of this.doc.getElementsByTagNameNS(NS_SF, 'TEXT')) { if (X.val(t, 'NOLANGUAGE') === 'X') no++; else yes++; if (yes + no > 200) break; }
    return yes >= no;
  }
  /* kind: NEW_xx fcode suffix: PA WI GR AD TI SEC SER SES CD SEL CO CM SEF */
  createNode(kind, parentNode, { wtype } = {}) {
    const doc = this.doc;
    const style = this.currentStyle(parentNode);
    const oaWin = () => this.outattrEl({ WLEFT: '2.00', WWIDTH: '6.00', WTOP: '2.00', WHEIGHT: '2.00' });
    switch (kind) {
      case 'PA': {
        const obj = this.baseObj('PAGE', '%PAGE', 'New Page', 'PA', { NUMB_MODE: 'I', NUMB_TYPE: 'A', PAGEORTN: 'P' });
        X.setPath(obj, ['NEXTPAGE', 'INAME'], X.val(obj, 'NAME', 'INAME'));
        return this.nodeEl('PA', obj);
      }
      case 'WI': {
        const obj = this.baseObj('WINDOW', '%WINDOW', 'New Window', 'WI', { WTYPE: wtype || 'T' });
        obj.setAttribute('ID', this.nextId()); this.ids.set(obj.getAttribute('ID'), obj);
        const pc = X.ensure(obj, 'sf:PROC_CTRL');
        const rc = X.mk(doc, 'sf:NODE'); rc.setAttribute('ID', this.nextIdAfter(obj.getAttribute('ID')));
        X.set(rc, 'NODETYPE', 'RC'); rc.appendChild(X.mk(doc, 'sf:SUCC')); pc.appendChild(rc);
        return this.nodeEl('WI', obj, { outattr: oaWin(), succ: true });
      }
      case 'GRW': case 'ADW': {      /* graphic / address window on a page */
        const isG = kind === 'GRW';
        const obj = this.baseObj('WINDOW', '%WINDOW', 'New Window', 'WI', { WTYPE: isG ? 'G' : 'A' });
        obj.setAttribute('ID', this.nextId()); this.ids.set(obj.getAttribute('ID'), obj);
        const pc = X.ensure(obj, 'sf:PROC_CTRL');
        pc.appendChild(this.createNode(isG ? 'GR' : 'AD', parentNode));
        return this.nodeEl('WI', obj, { outattr: oaWin(), succ: true });
      }
      case 'GR': {
        const obj = this.baseObj('GRAPHIC', '%GRAPHIC', 'New Graphic', 'GR', { GTYPE: 'B', GKEYBDS: { OBJECT: 'GRAPHICS', ID: 'BMAP', BTYPE: 'BMON' }, APPMODE: 'B', U_SB: 'CM', U_SA: 'CM', RELMODE: 'W', ALIGNMENT: 'L', U_MARGIN: 'CM', BGR_EXT: { MARGINH: '0.00', U_MARGINH: 'CM', MARGINV: '0.00', U_MARGINV: 'CM' } });
        return this.nodeEl('GR', obj, { outattr: this.outattrEl() });
      }
      case 'AD': {
        const obj = this.baseObj('ADDRESS', '%ADDRESS', 'New Address', 'AD', { DELIVERY: 'P', ADDRTYPE: '1', ADDRPAR: '*', LINES: '10' });
        return this.nodeEl('AD', obj, { outattr: this.outattrEl() });
      }
      case 'TI': {
        const nolang = !this.textsAreTranslatable();
        const obj = this.baseObj('TEXT', '%TEXT', 'New Text', 'TI', { NOLANGUAGE: nolang ? 'X' : '', APPMODE: 'P', STYLE_NAME: style, TEXT_AREA: { ENABLED: 'F', NCOLS: '0', NROWS: '0' } });
        this.setTextLines(obj, [{ f: '*', t: '' }]);
        return this.nodeEl('TI', obj, { outattr: this.outattrEl() });
      }
      case 'CO': return this.nodeEl('CO', this.baseObj('CODE', '%CODE', 'New Program Lines', 'CO'));
      case 'CM': return this.nodeEl('CM', this.baseObj('COMMAND', '%COMMAND', 'New Command', 'CM'));
      case 'CD': {
        const obj = this.baseObj('CONDITION', '%CONDITION', 'New Alternative', 'CD');
        const node = this.nodeEl('CD', obj, { outattr: this.outattrEl() });
        const succ = X.kid(node, 'sf:SUCC');
        for (const ev of ['+', '-']) {
          const it = X.mk(doc, 'sf:item'); succ.appendChild(it);
          it.appendChild(this.eventNode(ev));
        }
        return node;
      }
      case 'SEF': case 'SEL': case 'SER': case 'SEE': {
        const map = { SEF: ['F', '%FOLDER', 'New Folder'], SEL: ['L', '%LOOP', 'New Loop'], SER: ['R', '%ROW', 'New Line'], SEE: ['E', '%CELL', 'New Column'] }[kind];
        const f = { SECTTYPE: map[0] };
        if (kind === 'SEL') Object.assign(f, { DATATYPE: 'L', TABHTYPE: 'I' });
        Object.assign(f, { U_FHEIGHT: 'CM', PATTERN: { PATTNUM: '0000', FRAME: '0.00', U_FRAME: 'PT' }, U_WIDTH: 'CM', U_LEFT: 'CM', U_TOP: 'CM', U_SB: 'CM', U_SA: 'CM' });
        const obj = this.baseObj('SECTION', map[1], map[2], 'SE', f);
        return this.nodeEl('SE', obj, { outattr: ['SER', 'SEE'].includes(kind) ? this.outattrEl() : null });
      }
      case 'SES': {
        const obj = this.baseObj('SECTION', '%TEMPLATE', 'New Template', 'SE', { SECTTYPE: 'S', OTABTYPE: 'S', U_FHEIGHT: 'CM', PATTERN: { PATTNUM: '0000', FRAME: '0.00', U_FRAME: 'PT' }, USEBORDER: 'X', WIDTH: '10.00', U_WIDTH: 'CM', APPMODE: 'L', U_LEFT: 'CM', U_TOP: 'CM', U_SB: 'CM', U_SA: 'CM' });
        const st = X.ensure(obj, 'STATLINES'); X.newItem(st, { NAME: '%C1', LINEFROM: '001', LINETO: '001', LHEIGHT: '0.50', U_LHEIGHT: 'CM', SHADING: '000' });
        const cl = X.ensure(obj, 'CELLS'); this.addCell(cl, '%C1', 1, '10.00', 'CM');
        return this.nodeEl('SE', obj, { outattr: this.outattrEl() });
      }
      case 'SEC': {
        const obj = this.baseObj('SECTION', '%TABLE', 'New Table', 'SE', { SECTTYPE: 'C', DATATYPE: 'L', TABHTYPE: 'I', OTABTYPE: 'D', OTABHEADER: 'A', OTABFOOTER: 'A', FHEIGHT: '1.00', U_FHEIGHT: 'CM', PATTERN: { PATTNUM: '0000', FRAME: '0.00', U_FRAME: 'PT' }, USEBORDER: 'X', WIDTH: '10.00', U_WIDTH: 'CM', APPMODE: 'L', U_LEFT: 'CM', U_TOP: 'CM', U_SB: 'CM', U_SA: 'CM' });
        const dl = X.ensure(obj, 'DYNLINES'); X.newItem(dl, { NAME: '%LTYPE1', DEFAULTVAL: 'X', SHADING: '000' });
        const cl = X.ensure(obj, 'CELLS'); this.addCell(cl, '%LTYPE1', 1, '10.00', 'CM');
        const node = this.nodeEl('SE', obj, { outattr: this.outattrEl() });
        const succ = X.kid(node, 'sf:SUCC');
        for (const ev of ['H', 'B', 'F']) { const it = X.mk(doc, 'sf:item'); succ.appendChild(it); it.appendChild(this.eventNode(ev)); }
        return node;
      }
      default: throw new Error('Unknown node kind ' + kind);
    }
  }
  nextIdAfter(id) { const n = parseInt(id, 10) + 1; const s = String(n) + ' '; this.ids.set(s, null); return s; }
  eventNode(evtype, sfield) {
    const obj = this.baseObj('EVENT', '%EVENT', 'New Event', 'EV', { EVTYPE: evtype, SFIELD: sfield || '' });
    return this.nodeEl('EV', obj);
  }
  addCell(cellsEl, lineName, colnr, width, unit) {
    const it = X.newItem(cellsEl, { NAME: lineName, COLUMNNR: String(colnr).padStart(3, '0'), CWIDTH: width, U_CWIDTH: unit, SHADING: '000' });
    const b = X.ensure(it, 'BORDERS'); const bi = X.newItem(b, { IDX: '001', INTENSITY: '000' });
    for (const s of ['LLEFT', 'LTOP', 'LRIGHT', 'LBOTTOM']) { X.set(bi, s, '0.00'); X.set(bi, s + '_U', 'MM'); }
    for (const c of ['FILLCOLOR', 'CLEFT', 'CTOP', 'CRIGHT', 'CBOTTOM']) { const e = X.ensure(bi, c); for (const k of ['RED', 'GREEN', 'BLUE']) X.set(e, k, '000'); }
    return it;
  }

  /* ---------- tree surgery ---------- */
  succItemOf(node) { return node.el.parentElement; } /* sf:item */
  insertNodeEl(nodeEl, parent, ref = null, where = 'child') {
    const doc = this.doc;
    const item = X.mk(doc, 'sf:item'); item.appendChild(nodeEl);
    if (where === 'child') {
      let succ = parent.succ;
      if (!succ) { const host = parent.succHost; succ = X.mk(doc, 'sf:SUCC'); host.appendChild(succ); }
      succ.appendChild(item);
    } else {
      const refItem = this.succItemOf(ref);
      refItem.parentElement.insertBefore(item, where === 'before' ? refItem : refItem.nextSibling);
    }
    return nodeEl;
  }
  removeNode(node) {
    /* window definitions inside the removed subtree that are referenced from other pages keep living there */
    const inside = el => node.el.contains(el);
    const defs = [...node.el.getElementsByTagNameNS(NS_SF, 'WINDOW')].filter(w => w.hasAttribute('ID'));
    for (const def of defs) {
      const id = def.getAttribute('ID');
      const ref = [...this.doc.getElementsByTagNameNS(NS_SF, 'WINDOW')].find(w => w.getAttribute('IDREF') === id && !inside(w));
      if (ref) ref.parentElement.replaceChild(def, ref);
    }
    const item = this.succItemOf(node);
    item.remove();
  }
  /* deep copy of a node with fresh names, outattrs and ids */
  cloneNode(node, { asWindowRef = false } = {}) {
    if (node.type === 'WI' && asWindowRef) {
      const nodeEl = X.mk(this.doc, 'sf:NODE'); X.set(nodeEl, 'NODETYPE', 'WI');
      const holder = X.mk(this.doc, 'sf:OBJ'); const ref = X.mk(this.doc, 'sf:WINDOW');
      let idOwner = node.obj; if (!idOwner.getAttribute('ID')) { idOwner.setAttribute('ID', this.nextId()); }
      ref.setAttribute('IDREF', idOwner.getAttribute('ID')); holder.appendChild(ref); nodeEl.appendChild(holder);
      if (node.outattr) { const oa = node.outattr.parentElement.cloneNode(true); this.renewObj(oa.firstElementChild, '%OUTATTRIB', 'OUTATTR'); nodeEl.appendChild(oa); }
      nodeEl.appendChild(X.mk(this.doc, 'sf:SUCC'));
      return nodeEl;
    }
    const copy = node.el.cloneNode(true);
    if (node.type === 'PA') {
      /* a copied page shows the same windows (references), like SAP */
      for (const w of [...copy.getElementsByTagNameNS(NS_SF, 'WINDOW')]) {
        if (w.parentElement?.localName !== 'OBJ') continue;
        const id = w.getAttribute('ID') || w.getAttribute('IDREF');
        const orig = id && this.ids.get(id);
        if (orig && orig.isConnected && orig !== w) {
          const ref = X.mk(this.doc, 'sf:WINDOW'); ref.setAttribute('IDREF', id); w.parentElement.replaceChild(ref, w);
        }
      }
    }
    /* resolve remaining IDREF windows into real copies */
    for (const w of [...copy.getElementsByTagNameNS(NS_SF, 'WINDOW')]) {
      if (w.hasAttribute('IDREF')) { const src = this.ids.get(w.getAttribute('IDREF')); if (src && !(node.type === 'PA' && src.isConnected)) w.parentElement.replaceChild(src.cloneNode(true), w); }
    }
    const tags = ['PAGE', 'WINDOW', 'TEXT', 'GRAPHIC', 'ADDRESS', 'COMMAND', 'CODE', 'CONDITION', 'SECTION', 'EVENT', 'OUTATTR'];
    const prefixOf = { OUTATTR: '%OUTATTRIB', CONDITION: '%CONDITION', EVENT: '%EVENT' };
    const all = [copy, ...copy.getElementsByTagNameNS(NS_SF, '*')];
    for (const el of all) {
      if (el.hasAttribute && el.hasAttribute('IDREF')) continue;
      if (el.hasAttribute && el.hasAttribute('ID')) { const nid = this.nextId(); el.setAttribute('ID', nid); this.ids.set(nid, el); }
      if (el.namespaceURI !== NS_SF || !tags.includes(el.localName) || !X.kid(el, 'NAME')) continue;
      const nm = X.val(el, 'NAME', 'INAME');
      const tag = el.localName;
      const auto = /^%[A-Z]+\d+$/.test(nm) || prefixOf[tag];
      const taken = this.names(tag);
      if (!auto && !taken.has(nm)) continue;
      const prefix = prefixOf[tag] || (nm.match(/^(%?[A-Z_]*?)\d*$/)?.[1] || '%' + tag);
      this.renewObj(el, prefix, tag);
    }
    return copy;
  }
  renewObj(obj, prefix, tag) {
    const old = X.val(obj, 'NAME', 'INAME');
    let nm = this.nextAutoName(prefix, tag).name;
    /* names created in this clone are not yet in the document: add suffix until unique */
    const pending = this._pending ||= new Set();
    while (pending.has(tag + nm)) { const m = /^(.*?)(\d+)$/.exec(nm); nm = m[1] + (+m[2] + 1); }
    pending.add(tag + nm);
    X.setPath(obj, ['NAME', 'INAME'], nm);
    for (const h of ['T_CAPTION', 'T_TEXT']) for (const it of X.kids(X.kid(obj, h), 'item')) if (X.val(it, 'INAME') === old) X.set(it, 'INAME', nm);
  }
  endClone() { this._pending = null; }

  /* ---------- serialization ---------- */
  serialize() { return serializeXml(this.doc); }
}

/* ---------- Smart Style ---------- */
class SfStyle {
  constructor(doc, meta = {}) {
    this.doc = doc; this.root = doc.documentElement; this.meta = meta;
    if (this.root.localName !== 'SMARTSTYLE') throw new Error('Not a Smart Style: root element ' + this.root.localName);
    this.iso = this.root.getAttributeNS(NS_ST, 'language') || 'EN';
    this.lang = LANG.sap(this.iso);
    this.journal = new Journal(doc, label => Bus.emit('changed', this, label));
  }
  get header() { return X.kid(this.root, 'sf:HEADER'); }
  get name() { return X.val(this.header, 'STYLENAME'); }
  list(which) { return X.kids(X.kid(this.root, 'sf:' + which), 'item'); }
  paragraphs() { return this.list('PARAGRAPHS'); }
  strings() { return this.list('STRINGS'); }
  tabstops(par) { return this.list('TABSTOPS').filter(t => X.val(t, 'TDPARGRAPH') === par); }
  para(code) { return this.paragraphs().find(p => X.val(p, 'TDPARGRAPH') === code) || null; }
  str(code) { return this.strings().find(p => X.val(p, 'TDSTRING') === code) || null; }
  ensureList(which) {
    let l = X.kid(this.root, 'sf:' + which);
    if (!l) l = X.insertOrdered(this.root, X.mk(this.doc, 'sf:' + which, NS_ST));
    return l;
  }
  serialize() { return serializeXml(this.doc); }
}

function openDocument(text, meta) {
  const doc = parseXml(text);
  const r = doc.documentElement.localName;
  if (r === 'SMARTFORM') return new SfForm(doc, meta);
  if (r === 'SMARTSTYLE') return new SfStyle(doc, meta);
  throw new Error(`Unknown XML root "${r}". Expected SMARTFORM or SMARTSTYLE.`);
}

/* =====================================================================
   dynpro.js — renders SAP dynpro definitions (screens.json) 1:1.
   Positions come from the screen painter (line / column / length);
   field logic comes from a binding object per screen (bindings.js).
   ===================================================================== */
'use strict';

const CW = 7.4;   /* px per character cell */
const LH = 24;    /* px per screen line */

const Dynpro = {
  /* env: { edit:bool, pai(label, fn), rerender(), sel: Map(TC -> Set), msg(type,text), app } */
  render(key, binding, env, opts = {}) {
    const scr = SCREENS[key];
    const root = document.createElement('div');
    root.className = 'dyn';
    root.dataset.screen = key;
    if (!scr) { root.textContent = `Screen ${key} not found`; return root; }
    const b = binding || {};
    const fit = opts.fit; /* subscreen area size in lines/cols */
    /* extent of the fixed-size content */
    let maxC = 1, maxL = 1;
    for (const e of scr.els) if (!e.inv && e.cont === 'SCREEN') { maxC = Math.max(maxC, e.c - 1 + (e.w || 1) + 1); maxL = Math.max(maxL, e.l + (e.h || 1) - 1); }
    for (const c of scr.conts) if (!c.of || c.of === 'SCREEN') { maxC = Math.max(maxC, c.rh ? c.c + 30 : c.c - 1 + c.w); maxL = Math.max(maxL, c.l - 1 + (c.rv ? Math.min(c.h, c.t === 'TABLE_CTRL' ? 380 / LH : 560 / LH) : c.h)); }
    const hasResizable = scr.conts.some(c => (!c.of || c.of === 'SCREEN') && c.rh && c.t !== 'SUBSCREEN');
    root.style.width = hasResizable || opts.stretch ? '100%' : (Math.min(fit?.w || scr.cols, maxC + 1) * CW) + 'px';
    root.style.minWidth = (maxC * CW) + 'px';
    root.style.minHeight = (Math.min(fit?.h || scr.lines, maxL + 1) * LH) + 'px';

    const conts = Object.fromEntries(scr.conts.map(c => [c.n, c]));
    const tcOf = el => {
      let c = el.cont;
      while (c && conts[c]) { if (conts[c].t === 'TABLE_CTRL') return c; if (conts[c].t === 'STRIP_CTRL') return c; c = conts[c].of; }
      return null;
    };
    const visible = el => {
      if (b.vis) { const v = b.vis(el); if (v !== undefined) return v; }
      return !el.inv;
    };
    const editable = el => env.edit && !el.ro && (el.in || ['CHECK', 'RADIO'].includes(el.t)) && !(b.ro && b.ro(el));

    /* frames first so fields render above them */
    const els = scr.els.filter(e => !tcOf(e) && visible(e));
    for (const el of els.filter(e => e.t === 'FRAME')) root.appendChild(Dynpro.frame(el));

    /* containers: subscreens, custom controls, table controls */
    for (const c of scr.conts) {
      if (c.of && c.of !== 'SCREEN') continue; /* nested in tabstrip / table control: handled elsewhere */
      if (c.t === 'SUBSCREEN') {
        const host = Dynpro.box(c, 'dyn-sub');
        const sub = b.sub?.[c.n];
        if (sub) {
          const r = typeof sub === 'function' ? sub(host, env) : sub;
          if (typeof r === 'string') host.appendChild(env.renderScreen(r, { w: c.w, h: c.h }));
          else if (r instanceof Node) host.appendChild(r);
        }
        if (host.childNodes.length) root.appendChild(host);
      } else if (c.t === 'CUST_CTRL') {
        const host = Dynpro.box(c, 'dyn-cust');
        const fn = b.cust?.[c.n];
        if (fn) { fn(host, env, c); root.appendChild(host); }
      } else if (c.t === 'TABLE_CTRL') {
        if (b.vis && b.vis({ n: c.n, t: 'TABLE_CTRL' }) === false) continue;
        root.appendChild(Dynpro.tableCtrl(scr, c, scr.els.filter(e => tcOf(e) === c.n), b.tc?.[c.n], env));
      }
    }

    for (const el of els) {
      if (el.t === 'FRAME') continue;
      const node = Dynpro.element(el, b, env, editable(el), scr);
      if (node) root.appendChild(node);
    }
    return root;
  },

  box(c, cls) {
    const d = document.createElement('div');
    d.className = cls;
    d.style.left = ((c.c - 1) * CW) + 'px';
    d.style.top = ((c.l - 1) * LH) + 'px';
    /* resizable controls (rh/rv) fill the free space like in SAP GUI */
    if (c.rh && c.t !== 'SUBSCREEN') { d.style.right = '6px'; d.style.minWidth = Math.min(c.w * CW, 420) + 'px'; } else d.style.width = (c.w * CW) + 'px';
    if (c.rv && c.t !== 'SUBSCREEN') { d.style.height = Math.min(c.h * LH, c.t === 'TABLE_CTRL' ? 380 : 560) + 'px'; d.classList.add('rv'); } else d.style.height = (c.h * LH) + 'px';
    d.dataset.name = c.n;
    return d;
  },
  place(node, el, wChars) {
    node.style.left = ((el.c - 1) * CW) + 'px';
    node.style.top = ((el.l - 1) * LH) + 'px';
    if (wChars) node.style.width = (wChars * CW) + 'px';
  },
  frame(el) {
    const f = document.createElement('fieldset');
    f.className = 'dyn-frame';
    f.style.left = ((el.c - 1) * CW + 2) + 'px';
    f.style.top = ((el.l - 1) * LH + 4) + 'px';
    f.style.width = (el.w * CW - 4) + 'px';
    f.style.height = ((el.h) * LH - 8) + 'px';
    if (el.tx) { const lg = document.createElement('legend'); lg.textContent = el.tx; f.appendChild(lg); }
    return f;
  },
  labelNode(tx) {
    const { icon: ic, tip, text } = parseIconText(tx);
    const span = document.createElement('span');
    if (ic) span.insertAdjacentHTML('beforeend', icon(ic));
    if (text) span.appendChild(document.createTextNode(text));
    if (tip) span.title = tip;
    return span;
  },
  element(el, b, env, canEdit, scr) {
    let f = b.f?.[el.n] || {};
    switch (el.t) {
      case 'TEXT': {
        const s = document.createElement('label');
        s.className = 'dyn-text';
        Dynpro.place(s, el, el.w);
        const tx = f.label ? f.label() : el.tx;
        s.appendChild(Dynpro.labelNode(tx));
        s.title = s.textContent;
        s.dataset.for = el.n;
        return s;
      }
      case 'TEMPLATE': {
        const val = f.get ? f.get() : undefined;
        const bound = !!f.get;
        let input;
        const values = f.values ? f.values() : null;
        if (el.dd === 'L' || (values && f.dropdown)) {
          input = document.createElement('select');
          const list = values || [];
          const cur = val ?? '';
          let found = false;
          for (const [k, t] of list) {
            const o = document.createElement('option'); o.value = k; o.textContent = t; if (k === cur) { o.selected = true; found = true; } input.appendChild(o);
          }
          if (!found && cur !== '') { const o = document.createElement('option'); o.value = cur; o.textContent = cur; o.selected = true; input.prepend(o); }
          if (!found && cur === '' && !list.some(([k]) => k === '')) { const o = document.createElement('option'); o.value = ''; o.textContent = ''; o.selected = true; input.prepend(o); }
        } else {
          input = document.createElement('input');
          input.type = 'text';
          input.value = val ?? '';
          input.maxLength = f.maxLength || el.len || 132;
          input.spellcheck = false;
          if (!el.lc && !f.lower && canEdit && bound) input.classList.add('upper');
          if (values && values.length && !f.f4) {
            /* possible entries (F4) like SAP: double-click, F4 or the help marker */
            f = { ...f, f4: inp => APP.popupList(inp, 'Possible Entries', values, inp.value, v => { inp.value = v; inp.dispatchEvent(new Event('change')); }) };
            input.title = values.slice(0, 12).map(([k, t]) => `${k}  ${t !== k ? t : ''}`.trim()).join('\n') + (values.length > 12 ? '\n…' : '');
          }
        }
        input.className = (input.className + ' dyn-field').trim();
        input.name = el.n;
        if (el.req) input.classList.add('req');
        Dynpro.place(input, el, Math.max(el.w, 2) + (input.tagName === 'SELECT' ? 3 : el.w <= 3 ? 2.4 : 1.5));
        Dynpro.wireInput(input, el, f, env, canEdit && bound);
        if (!bound) input.classList.add('unbound');
        return input;
      }
      case 'CHECK': {
        const lab = document.createElement('label');
        lab.className = 'dyn-check';
        Dynpro.place(lab, el, el.w + 2);
        const cb = document.createElement('input'); cb.type = 'checkbox'; cb.name = el.n;
        cb.checked = !!(f.get && f.get());
        cb.disabled = !(canEdit && f.set);
        cb.addEventListener('change', () => env.pai(`${el.n}`, () => f.set(cb.checked)));
        lab.appendChild(cb);
        if (el.tx) lab.appendChild(Dynpro.labelNode(el.tx));
        if (!f.get) lab.classList.add('unbound');
        return lab;
      }
      case 'RADIO': {
        const lab = document.createElement('label');
        lab.className = 'dyn-radio';
        Dynpro.place(lab, el, el.w + 2);
        const rb = document.createElement('input'); rb.type = 'radio'; rb.name = scr.prog + scr.dynnr + (el.cont || 'rg');
        rb.dataset.field = el.n;
        rb.checked = !!(f.get && f.get());
        rb.disabled = !(canEdit && f.set);
        rb.addEventListener('change', () => { if (rb.checked) env.pai(`${el.n}`, () => f.set(true)); });
        lab.appendChild(rb);
        if (el.tx) lab.appendChild(Dynpro.labelNode(el.tx));
        if (!f.get) lab.classList.add('unbound');
        return lab;
      }
      case 'PUSH': {
        const btn = document.createElement('button');
        btn.type = 'button'; btn.className = 'dyn-push'; btn.name = el.n;
        Dynpro.place(btn, el, Math.max(el.w, 2) + 1);
        const { icon: idTx, tip, text } = parseIconText(el.tx);
        const ic = el.icon || idTx;
        if (ic) btn.insertAdjacentHTML('beforeend', icon(ic));
        if (text) btn.appendChild(document.createTextNode(text));
        btn.title = tip || el.qi || text || el.n;
        const fc = el.fc;
        const handler = (b.fc && (b.fc[fc] || b.fc[el.n])) || null;
        const needsEdit = !['CHECK', 'TPAINT', 'TPATTERN', 'BP_OPTIONS', 'INFO', 'TC_PREV', 'TC_NEXT', 'TC_PREV_PAGE', 'TC_NEXT_PAGE', 'TC_CHECK', 'EDIT'].includes(fc);
        btn.disabled = !handler || (needsEdit && !env.edit);
        if (handler) btn.addEventListener('click', () => {
          const r = handler(env, btn);
          if (r && typeof r.then === 'function') return;
        });
        if (!el.w || el.w <= 4) btn.classList.add('icon-only');
        return btn;
      }
      default: return null;
    }
  },
  wireInput(input, el, f, env, canEdit) {
    input.disabled = !canEdit;
    if (!canEdit) input.readOnly = true;
    if (!canEdit && input.tagName === 'INPUT') { input.disabled = false; input.readOnly = true; input.tabIndex = -1; input.classList.add('ro'); }
    if (!canEdit) return;
    let last = input.value;
    const commit = () => {
      if (input.value === last && input.tagName === 'INPUT') return; last = input.value;
      let v = input.value;
      if (input.tagName === 'INPUT' && input.classList.contains('upper')) v = v.toUpperCase();
      const cur = f.get ? (f.get() ?? '') : '';
      if (v === cur) return;
      env.pai(el.n, () => f.set(v));
    };
    input.addEventListener('change', commit);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); commit(); }
      if (e.key === 'F4' && f.f4) { e.preventDefault(); f.f4(input); }
    });
    if (f.f4) { input.classList.add('has-f4'); input.addEventListener('dblclick', () => f.f4(input)); }
  },

  /* ---------------- table control ---------------- */
  tableCtrl(scr, c, els, tb, env) {
    const wrap = Dynpro.box(c, 'dyn-tc');
    const title = els.find(e => e.t === 'TEXT' && !e.c);
    const colIdx = [...new Set(els.filter(e => e.c).map(e => e.c))].sort((a, b) => a - b);
    const cols = colIdx.map(i => {
      const at = els.filter(e => e.c === i);
      const field = at.find(e => e.in || ['CHECK', 'RADIO', 'PUSH_'].includes(e.t)) || at.find(e => e.t === 'TEMPLATE');
      const head = at.find(e => e !== field && (e.t === 'TEXT' || e.t === 'TEMPLATE')) || null;
      return { i, field, head };
    }).filter(c => c.field && !(tb?.hideCol && tb.hideCol(c.field.n)));
    if (title) { const t = document.createElement('div'); t.className = 'tc-title'; t.textContent = tb?.title ? tb.title() : title.tx; wrap.appendChild(t); }
    const scroller = document.createElement('div'); scroller.className = 'tc-scroll';
    const table = document.createElement('table'); table.className = 'tc';
    const thead = table.createTHead().insertRow();
    thead.insertCell().className = 'tc-sel-h';
    for (const col of cols) {
      const th = document.createElement('th');
      let label = col.head ? (col.head.t === 'TEMPLATE' ? (tb?.headerValue ? tb.headerValue(col.head.n) : '') : col.head.tx) : '';
      if (tb?.label?.[col.field.n]) label = tb.label[col.field.n]();
      th.appendChild(Dynpro.labelNode(label || ''));
      th.style.minWidth = (Math.max(col.field.w, 2) * CW + 10) + 'px';
      thead.appendChild(th);
    }
    const tbody = table.createTBody();
    const rows = tb ? tb.rows() : [];
    const sel = env.sel(c.n);
    const canEdit = env.edit && tb && !tb.readonly;
    const visRows = Math.min(c.h - 2, 12);
    const emptyRows = canEdit && tb.add ? Math.max(2, visRows - rows.length) : Math.max(0, visRows - rows.length);
    const total = rows.length + emptyRows;
    for (let ri = 0; ri < total; ri++) {
      const row = rows[ri];
      const tr = tbody.insertRow();
      const sc = tr.insertCell(); sc.className = 'tc-sel';
      if (row !== undefined) {
        if (sel.has(ri)) tr.classList.add('sel');
        sc.addEventListener('click', ev => {
          if (!ev.ctrlKey && !ev.shiftKey && !ev.metaKey) { const had = sel.has(ri) && sel.size === 1; sel.clear(); if (!had) sel.add(ri); }
          else if (sel.has(ri)) sel.delete(ri); else sel.add(ri);
          env.rerender();
        });
      }
      for (const col of cols) {
        const td = tr.insertCell();
        const fe = col.field; const cb = tb?.col?.[fe.n] || {};
        const val = row !== undefined && cb.get ? cb.get(row) : (fe.t === 'CHECK' ? false : '');
        const rowRo = row !== undefined && cb.ro && cb.ro(row);
        const editableCell = canEdit && !!cb.set && !rowRo && (row !== undefined || !!tb.add);
        if (fe.t === 'CHECK' || fe.t === 'RADIO') {
          const inp = document.createElement('input'); inp.type = fe.t === 'CHECK' ? 'checkbox' : 'radio';
          if (fe.t === 'RADIO') inp.name = `${c.n}-${fe.cont}-${ri}`;
          inp.checked = !!val; inp.disabled = !editableCell || row === undefined;
          inp.addEventListener('change', () => env.pai(fe.n, () => cb.set(row, inp.checked)));
          td.className = 'tc-center'; td.appendChild(inp);
        } else if (fe.t === 'PUSH_') {
          const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'tc-push';
          const disp = cb.display ? cb.display(row) : val;
          btn.textContent = disp || '';
          btn.disabled = !editableCell || row === undefined;
          if (cb.click) btn.addEventListener('click', () => cb.click(row, btn, env));
          td.className = 'tc-center'; td.appendChild(btn);
        } else {
          const values = cb.values ? cb.values(row) : null;
          let inp;
          if (fe.dd === 'L' && values) {
            inp = document.createElement('select');
            const cur = val ?? '';
            if (!values.some(([k]) => k === cur)) { const o = document.createElement('option'); o.value = cur; o.textContent = cur; inp.appendChild(o); }
            for (const [k, t] of values) { const o = document.createElement('option'); o.value = k; o.textContent = t; if (k === cur) o.selected = true; inp.appendChild(o); }
          } else {
            inp = document.createElement('input'); inp.type = 'text'; inp.value = val ?? ''; inp.spellcheck = false;
            inp.maxLength = cb.maxLength || fe.len || 132;
            if (!fe.lc && !cb.lower) inp.classList.add('upper');
            if (values && values.length) { inp.classList.add('has-f4'); inp.title = values.slice(0, 12).map(([k, t]) => `${k}  ${t !== k ? t : ''}`.trim()).join('\n'); const f4 = () => { if (inp.readOnly) return; APP.popupList(inp, 'Possible Entries', values, inp.value, v => { inp.value = v; inp.dispatchEvent(new Event('change')); }); }; inp.addEventListener('dblclick', f4); inp.addEventListener('keydown', e => { if (e.key === 'F4') { e.preventDefault(); f4(); } }); }
          }
          inp.className += ' tc-in';
          inp.dataset.k = c.n + ':' + ri + ':' + fe.n;
          inp.style.width = (Math.max(fe.w, 2) * CW + (fe.w <= 3 ? 16 : 8)) + 'px';
          if (!editableCell) { inp.readOnly = true; inp.tabIndex = -1; inp.classList.add('ro'); if (inp.tagName === 'SELECT') inp.disabled = true; }
          else {
            let last = inp.value;
            const commit = () => {
              if (inp.value === last) return; last = inp.value;
              let v = inp.value; if (inp.classList.contains('upper')) v = v.toUpperCase();
              if (row === undefined) { if (v === '') return; env.pai(fe.n, () => { const nr = tb.add(); cb.set(nr, v); }); }
              else if (v !== (val ?? '')) env.pai(fe.n, () => cb.set(row, v));
            };
            inp.addEventListener('change', commit);
            inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); commit(); } });
          }
          td.appendChild(inp);
        }
      }
      if (row === undefined) tr.classList.add('tc-empty');
      if (tb?.rowClass && row !== undefined) { const cls = tb.rowClass(row); if (cls) tr.classList.add(cls); }
    }
    scroller.appendChild(table);
    wrap.appendChild(scroller);
    return wrap;
  },
};

/* =====================================================================
   abapeditor.js — ABAP editor control (program lines, global types,
   initialization, form routines). Line numbers, keyword highlighting,
   syntax check of block structure, Pretty Printer (keywords upper case,
   SAP indentation by 2).
   ===================================================================== */
'use strict';

const AbapEditor = (() => {
  const KW = ('ADD AND APPEND APPENDING AS ASCENDING ASSIGN ASSIGNING AT AUTHORITY-CHECK BEGIN BETWEEN BINARY BREAK-POINT BY BYTE CALL CASE CATCH ' +
    'CHANGING CHECK CLASS CLEAR CLOSE COLLECT COMMIT COMPUTE CONCATENATE CONDENSE CONSTANTS CONTINUE CONV CORRESPONDING CREATE DATA DEFAULT ' +
    'DEFINE DELETE DESCENDING DESCRIBE DIVIDE DO ELSE ELSEIF END END-OF-DEFINITION ENDCASE ENDCLASS ENDDO ENDFORM ENDFUNCTION ENDIF ENDLOOP ' +
    'ENDMETHOD ENDMODULE ENDSELECT ENDTRY ENDWHILE ENDAT ENDON ENDPROVIDE ENTRIES EQ EXCEPTIONS EXIT EXPORTING FIELD FIELD-SYMBOLS FIND FOR FORM FREE FROM ' +
    'FUNCTION GE GET GT IF IMPORTING IN INDEX INITIAL INNER INSERT INTO IS JOIN KEY LE LEFT LENGTH LIKE LINE LINES LOOP LT MESSAGE METHOD MODIFY ' +
    'MOVE MOVE-CORRESPONDING MULTIPLY NE NEW NOT OCCURS OF OFFSET ON OR ORDER OTHERS OVERLAY PACK PERFORM RAISE RAISING RANGE RANGES READ REF REFRESH REPLACE ' +
    'RETURN RETURNING SEARCH SELECT SELECT-OPTIONS SET SHIFT SINGLE SIZE SORT SPLIT STANDARD STATICS STRUCTURE SUBMIT SUBTRACT SUM TABLE TABLES ' +
    'TO TRANSFER TRANSLATE TRY TYPE TYPES UNASSIGN UNPACK UP UPDATE USING VALUE WHEN WHERE WHILE WITH WORK WRITE ZONE ABS BOUND REDUCE COND SWITCH ' +
    'LINE_EXISTS LINES STRLEN XSDBOOL UPPER LOWER TO_UPPER TO_LOWER DIV MOD BIT-AND IS NOT ASSIGNED SUPPLIED REQUESTED SORTED HASHED UNIQUE NON-UNIQUE ' +
    'RESPECTING BLANKS SEPARATED UNTIL VARYING CO CN CA NA CS NS CP NP BT NB DECIMALS CURRENCY UNIT EDIT MASK NO-ZERO NO-GAP NO-SIGN TIME DATE ZERO ' +
    'IMPORT EXPORT MEMORY ID SHARED BUFFER PROTECTED PRIVATE PUBLIC SECTION DEFINITION IMPLEMENTATION METHODS CLASS-METHODS EVENTS INTERFACE ENDINTERFACE ' +
    'INHERITING FINAL ABSTRACT REDEFINITION LET PARAMETERS NEXT SKIP ULINE CONVERT TIME STAMP GROUP GROUPS MEMBERS ENDENHANCEMENT ENHANCEMENT ASSERT ' +
    'FETCH CURSOR OPEN PACKAGE UP TO ROWS HAVING DISTINCT COUNT MAX MIN AVG CAST').split(' ');
  const KWSET = new Set(KW);
  const OPEN = { IF: 'ENDIF', LOOP: 'ENDLOOP', DO: 'ENDDO', WHILE: 'ENDWHILE', CASE: 'ENDCASE', TRY: 'ENDTRY', FORM: 'ENDFORM', SELECT: 'ENDSELECT',
    METHOD: 'ENDMETHOD', CLASS: 'ENDCLASS', FUNCTION: 'ENDFUNCTION', AT: 'ENDAT', DEFINE: 'END-OF-DEFINITION', INTERFACE: 'ENDINTERFACE', PROVIDE: 'ENDPROVIDE', ON: 'ENDON' };
  const CLOSE = Object.fromEntries(Object.entries(OPEN).map(([k, v]) => [v, k]));
  const MIDDLE = new Set(['ELSE', 'ELSEIF', 'WHEN', 'CATCH', 'CLEANUP']);

  /* split statement text; strips comments and literals */
  function scan(lines) {
    const stmts = []; let cur = { text: '', line: 0 };
    lines.forEach((raw, i) => {
      if (/^\*/.test(raw)) return;
      let s = '', q = null;
      for (let k = 0; k < raw.length; k++) {
        const c = raw[k];
        if (q) { if (c === q) { if (raw[k + 1] === q) { k++; continue; } q = null; } s += ' '; continue; }
        if (c === '"') break;
        if (c === "'" || c === '`' || c === '|') { q = c; s += ' '; continue; }
        if (c === '.') { cur.text += s; if (!cur.line) cur.line = i + 1; if (cur.text.trim()) stmts.push(cur); cur = { text: '', line: 0 }; s = ''; continue; }
        if (c === ':' ) { s += ' '; continue; }
        s += c;
      }
      if (s.trim() && !cur.line) cur.line = i + 1;
      cur.text += s + ' ';
    });
    if (cur.text.trim()) stmts.push({ ...cur, open: true });
    return stmts;
  }
  function firstWord(t) { return (t.trim().split(/\s+/)[0] || '').toUpperCase(); }

  function check(lines) {
    const stmts = scan(lines);
    const stack = [];
    for (const st of stmts) {
      if (st.open) return { ok: false, line: st.line, msg: `Line ${st.line}: statement is not terminated with a period` };
      let w = firstWord(st.text);
      const words = st.text.trim().toUpperCase().split(/\s+/);
      if (w === 'AT' && !/^AT\s+(NEW|END|FIRST|LAST|SELECTION-SCREEN|LINE-SELECTION|USER-COMMAND|PF\d+)/i.test(st.text.trim())) continue;
      if (w === 'SELECT' && (words.includes('SINGLE') || /\bINTO\s+(CORRESPONDING\s+FIELDS\s+OF\s+)?TABLE\b/i.test(st.text) || /\bUP\s+TO\s+1\s+ROWS\b/i.test(st.text) && /\bINTO\b/i.test(st.text) === false)) continue;
      if (w === 'SELECT' && /\bCOUNT\s*\(\s*\*\s*\)/i.test(st.text) && !/\bGROUP\b/i.test(st.text)) continue;
      if (w === 'CLASS' && /\b(DEFINITION\s+(DEFERRED|LOAD)|LOCAL\s+FRIENDS)\b/i.test(st.text)) continue;
      if (w === 'INTERFACE' && /\b(DEFERRED|LOAD)\b/i.test(st.text)) continue;
      if (w === 'ON' && !/^ON\s+CHANGE\s+OF/i.test(st.text.trim())) continue;
      if (w === 'DATA' && /^DATA\s*\(/i.test(st.text.trim())) continue;
      if (w === 'LOOP' && /\bLOOP\s+AT\s+SCREEN\b/i.test(st.text)) { stack.push({ w, line: st.line }); continue; }
      if (OPEN[w]) { stack.push({ w, line: st.line }); continue; }
      if (CLOSE[w]) {
        const top = stack.pop();
        if (!top) return { ok: false, line: st.line, msg: `Line ${st.line}: ${w} without ${CLOSE[w]}` };
        if (OPEN[top.w] !== w) return { ok: false, line: st.line, msg: `Line ${st.line}: ${w} found, but ${OPEN[top.w]} expected for ${top.w} in line ${top.line}` };
        continue;
      }
      if (MIDDLE.has(w)) {
        const top = stack[stack.length - 1];
        const want = { ELSE: ['IF'], ELSEIF: ['IF'], WHEN: ['CASE'], CATCH: ['TRY'], CLEANUP: ['TRY'] }[w];
        if (!top || !want.includes(top.w)) return { ok: false, line: st.line, msg: `Line ${st.line}: ${w} is only allowed inside ${want.join('/')}` };
      }
    }
    if (stack.length) { const t = stack[stack.length - 1]; return { ok: false, line: t.line, msg: `Line ${t.line}: ${t.w} is not closed (${OPEN[t.w]} missing)` }; }
    return { ok: true, msg: 'No syntax errors found' };
  }

  /* Pretty Printer: keywords upper case, indentation */
  function pretty(lines) {
    const out = []; let ind = 0; let cont = false; let pendingDedentAfter = false;
    for (const raw of lines) {
      if (/^\*/.test(raw)) { out.push(raw); continue; }
      const t = raw.trim();
      if (!t) { out.push(''); continue; }
      const up = upperKw(t);
      const w = firstWord(t.replace(/^[\s,]*/, ''));
      let myInd = ind;
      if (!cont) {
        if (CLOSE[w]) { ind = Math.max(0, ind - 2); myInd = ind; }
        else if (MIDDLE.has(w)) myInd = Math.max(0, ind - 2);
      } else myInd = ind + 2;
      out.push(' '.repeat(myInd) + up);
      const code = stripLit(t);
      const ends = /\.\s*$/.test(code);
      if (!cont && OPEN[w] && !isSingle(w, t)) ind += 2;
      cont = !ends && !/^\*/.test(t);
    }
    return out;
  }
  function isSingle(w, t) {
    if (w === 'SELECT' && (/\bSINGLE\b/i.test(t) || /\bTABLE\b/i.test(t))) return true;
    if (w === 'AT' && !/^AT\s+(NEW|END|FIRST|LAST)/i.test(t)) return true;
    if (w === 'CLASS' && /DEFERRED|LOAD/i.test(t)) return true;
    if (w === 'ON' && !/^ON\s+CHANGE/i.test(t)) return true;
    return false;
  }
  function stripLit(t) { return t.replace(/'(?:[^']|'')*'|`[^`]*`|\|[^|]*\|/g, '""').replace(/".*$/, ''); }
  function upperKw(t) {
    let out = '', i = 0;
    while (i < t.length) {
      const c = t[i];
      if (c === '"') { out += t.slice(i); break; }
      if (c === "'" || c === '`' || c === '|') { let j = i + 1; while (j < t.length && !(t[j] === c && t[j + 1] !== c)) { if (t[j] === c) j++; j++; } out += t.slice(i, j + 1); i = j + 1; continue; }
      const m = /^[A-Za-z_][A-Za-z0-9_-]*/.exec(t.slice(i));
      if (m) { const word = m[0]; const prev = t[i - 1]; out += (KWSET.has(word.toUpperCase()) && prev !== '-' && prev !== '>' && prev !== '~') ? word.toUpperCase() : word; i += word.length; continue; }
      out += c; i++;
    }
    return out;
  }

  /* --- highlighting --- */
  function hl(line) {
    if (/^\*/.test(line)) return `<span class="ab-c">${esc(line)}</span>`;
    let out = '', i = 0;
    while (i < line.length) {
      const c = line[i];
      if (c === '"') { out += `<span class="ab-c">${esc(line.slice(i))}</span>`; break; }
      if (c === "'" || c === '`' || c === '|') { let j = i + 1; while (j < line.length && line[j] !== c) j++; out += `<span class="ab-s">${esc(line.slice(i, j + 1))}</span>`; i = j + 1; continue; }
      const m = /^[A-Za-z_][A-Za-z0-9_-]*/.exec(line.slice(i));
      if (m) { const word = m[0]; const prev = line[i - 1]; out += (KWSET.has(word.toUpperCase()) && prev !== '-' && prev !== '>' && prev !== '~') ? `<span class="ab-k">${esc(word)}</span>` : esc(word); i += word.length; continue; }
      const n = /^\d+/.exec(line.slice(i));
      if (n) { out += `<span class="ab-n">${n[0]}</span>`; i += n[0].length; continue; }
      out += esc(c); i++;
    }
    return out;
  }

  /* --- the control --- */
  function create(lines, editable, onCommit, opts = {}) {
    const root = document.createElement('div'); root.className = 'abap-ed';
    const bar = document.createElement('div'); bar.className = 'ab-bar';

    const gut = document.createElement('div'); gut.className = 'ab-gutter';

      'G_SECTION_CALCS-EVENT': { get: r => X.val(r, 'EVENT'), set: (r, v) => X.set(r, 'EVENT', v), values: VL.calcEvt },
      'G_SECTION_CALCS-EVENTNAME': { get: r => X.val(r, 'EVENTNAME'), set: (r, v) => X.set(r, 'EVENTNAME', v.toUpperCase()) },
      'G_SECTION_CALCS-INIT': { check: true, el: 'INIT' },

      'G_SECTION_CALCS-RESETNAME': { get: r => X.val(r, 'RESETNAME'), set: (r, v) => X.set(r, 'RESETNAME', v.toUpperCase()) },
    }, { init: it => { X.set(it, 'OPERATION', 'SUM'); X.set(it, 'EVENT', 'A'); } });
    return { tc: { TC_SECTIONCALCS: tb }, fc: tcCodes('TC_SECTIONCALCS', tb, ctx, { CHECK: env => APP.checkNode(ctx.node, env) }) };
  },
  'SAPLSTXB:1112': ctx => ({ vis: () => false }),

function fmtDate(d) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || ''); return m ? `${m[3]}.${m[2]}.${m[1]}` : d; }

function abapFc(ctx, getList) {
